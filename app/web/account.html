<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YABus 帳戶中心</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0b0f1a;
      --bg-secondary: #111827;
      --surface: rgba(255, 255, 255, 0.04);
      --surface-hover: rgba(255, 255, 255, 0.07);
      --surface-strong: rgba(255, 255, 255, 0.1);
      --ink: #f0f2f5;
      --ink-secondary: #94a3b8;
      --muted: #64748b;
      --line: rgba(255, 255, 255, 0.08);
      --line-strong: rgba(255, 255, 255, 0.14);
      --google: #ea4335;
      --google-glow: rgba(234, 67, 53, 0.25);
      --discord: #5865f2;
      --discord-glow: rgba(88, 101, 242, 0.25);
      --success: #34d399;
      --success-glow: rgba(52, 211, 153, 0.15);
      --warning: #fb923c;
      --warning-glow: rgba(251, 146, 60, 0.15);
      --error: #f87171;
      --error-glow: rgba(248, 113, 113, 0.15);
      --info: #60a5fa;
      --info-glow: rgba(96, 165, 250, 0.15);
      --accent: #6ee7b7;
      --accent-secondary: #a78bfa;
      --radius: 20px;
      --radius-sm: 14px;
      --radius-xs: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      color: var(--ink);
      background: var(--bg-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(110, 231, 183, 0.12), transparent),
        radial-gradient(ellipse 60% 40% at 80% 10%, rgba(167, 139, 250, 0.1), transparent),
        radial-gradient(ellipse 50% 60% at 50% 100%, rgba(88, 101, 242, 0.08), transparent);
      pointer-events: none;
      z-index: 0;
    }

    .shell {
      position: relative;
      z-index: 1;
      width: min(1200px, calc(100% - 40px));
      margin: 0 auto;
      padding: 40px 0 60px;
      display: grid;
      gap: 20px;
    }

    .hero,
    .panel,
    .identity,
    .device {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: var(--radius);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: border-color 0.3s ease, background 0.3s ease;
    }

    .panel:hover {
      border-color: var(--line-strong);
      background: var(--surface-hover);
    }

    .hero {
      padding: 40px;
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(240px, 0.7fr);
      gap: 24px;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(110, 231, 183, 0.08), transparent 70%);
      right: -150px;
      top: -200px;
      pointer-events: none;
      animation: float 8s ease-in-out infinite;
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(167, 139, 250, 0.06), transparent 70%);
      left: -100px;
      bottom: -150px;
      pointer-events: none;
      animation: float 10s ease-in-out infinite reverse;
    }

    @keyframes float {

      0%,
      100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(15px, -10px);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .shell>* {
      animation: fadeInUp 0.5s ease both;
    }

    .shell> :nth-child(2) {
      animation-delay: 0.08s;
    }

    .shell> :nth-child(3) {
      animation-delay: 0.16s;
    }

    .eyebrow {
      margin: 0 0 12px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
    }

    h1,
    h2,
    h3 {
      margin: 0;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    h1 {
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1.1;
      max-width: 14ch;
      background: linear-gradient(135deg, #f0f2f5 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    h2 {
      font-size: 20px;
    }

    h3 {
      font-size: 16px;
      font-weight: 600;
    }

    .hero p,
    .panel p,
    .device p,
    .identity p {
      margin: 0;
      color: var(--ink-secondary);
      line-height: 1.7;
      font-size: 14px;
    }

    .hero-aside {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 14px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid var(--line-strong);
      background: rgba(110, 231, 183, 0.08);
      color: var(--accent);
      font-weight: 600;
      font-size: 13px;
      width: fit-content;
    }

    .notice {
      padding: 20px 24px;
      display: grid;
      gap: 12px;
    }

    .notice h2 {
      font-size: 17px;
    }

    .notice-success {
      border-color: rgba(52, 211, 153, 0.25);
      background: var(--success-glow);
    }

    .notice-success h2 {
      color: var(--success);
    }

    .notice-error {
      border-color: rgba(248, 113, 113, 0.25);
      background: var(--error-glow);
    }

    .notice-error h2 {
      color: var(--error);
    }

    .notice-info {
      border-color: rgba(96, 165, 250, 0.2);
      background: var(--info-glow);
    }

    .notice-info h2 {
      color: var(--info);
    }

    .notice-warning {
      border-color: rgba(251, 146, 60, 0.25);
      background: var(--warning-glow);
    }

    .notice-warning h2 {
      color: var(--warning);
    }

    .notice-actions,
    .top-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(320px, 0.95fr);
      gap: 20px;
    }

    .panel {
      padding: 28px;
      display: grid;
      gap: 20px;
      align-content: start;
    }

    .panel-header {
      display: grid;
      gap: 8px;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .metric {
      padding: 18px;
      border-radius: var(--radius-sm);
      background: var(--surface-hover);
      border: 1px solid var(--line);
      transition: border-color 0.2s, transform 0.2s;
    }

    .metric:hover {
      border-color: var(--line-strong);
      transform: translateY(-2px);
    }

    .metric strong {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .metric span {
      display: block;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.4;
      word-break: break-word;
      color: var(--ink);
    }

    .identity-list,
    .device-list {
      display: grid;
      gap: 12px;
    }

    .identity,
    .device {
      padding: 20px;
      display: grid;
      gap: 10px;
      background: var(--surface-hover);
      transition: border-color 0.2s, transform 0.2s;
    }

    .identity:hover,
    .device:hover {
      border-color: var(--line-strong);
      transform: translateY(-2px);
    }

    .identity-head,
    .device-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 6px 14px;
      border: 1px solid var(--line);
      background: var(--surface);
      font-size: 12px;
      font-weight: 600;
    }

    .pill-google {
      color: var(--google);
      border-color: rgba(234, 67, 53, 0.25);
    }

    .pill-discord {
      color: var(--discord);
      border-color: rgba(88, 101, 242, 0.25);
    }

    .mono {
      font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
      font-size: 12px;
      color: var(--muted);
    }

    .empty {
      padding: 20px;
      border-radius: var(--radius-sm);
      border: 1px dashed rgba(255, 255, 255, 0.1);
      color: var(--muted);
      background: transparent;
      text-align: center;
      font-size: 13px;
    }

    .button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      padding: 10px 20px;
      border-radius: var(--radius-xs);
      border: 1px solid transparent;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    .button:active:not(:disabled) {
      transform: translateY(0);
    }

    .button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .button-primary {
      color: #0b0f1a;
      background: linear-gradient(135deg, var(--accent), #34d399);
      box-shadow: 0 4px 20px rgba(110, 231, 183, 0.25);
    }

    .button-primary:hover:not(:disabled) {
      box-shadow: 0 8px 30px rgba(110, 231, 183, 0.35);
    }

    .button-google {
      color: #fff;
      background: linear-gradient(135deg, #ea4335, #d33426);
      box-shadow: 0 4px 20px var(--google-glow);
    }

    .button-google:hover:not(:disabled) {
      box-shadow: 0 8px 30px rgba(234, 67, 53, 0.35);
    }

    .button-discord {
      color: #fff;
      background: linear-gradient(135deg, #5865f2, #4752c4);
      box-shadow: 0 4px 20px var(--discord-glow);
    }

    .button-discord:hover:not(:disabled) {
      box-shadow: 0 8px 30px rgba(88, 101, 242, 0.35);
    }

    .button-ghost {
      background: transparent;
      border-color: var(--line-strong);
      color: var(--ink-secondary);
    }

    .button-ghost:hover:not(:disabled) {
      background: var(--surface-hover);
      color: var(--ink);
    }

    .button-danger {
      color: #fff;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 4px 20px rgba(239, 68, 68, 0.2);
    }

    .button-danger:hover:not(:disabled) {
      box-shadow: 0 8px 30px rgba(239, 68, 68, 0.3);
    }

    .subtle {
      font-size: 13px;
      color: var(--muted);
    }

    @media (max-width: 980px) {

      .hero,
      .grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 680px) {
      .shell {
        width: calc(100% - 24px);
        padding-top: 24px;
      }

      .hero,
      .panel {
        padding: 20px;
      }

      .hero {
        gap: 16px;
      }

      .metrics {
        grid-template-columns: 1fr;
      }

      .identity-head,
      .device-head {
        align-items: start;
        flex-direction: column;
      }

      h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>
  <main class="shell">
    <section class="hero">
      <div class="hero-aside">
        <div class="badge" id="heroBadge">尚未登入</div>
        <button class="button button-ghost" type="button" id="logoutButton">登出</button>
      </div>
    </section>

    <section class="panel notice notice-info" id="noticePanel" hidden></section>

    <section class="grid" id="dashboard">
      <section class="panel">
        <div class="panel-header">
          <h2>帳戶資訊</h2>
        </div>
        <div class="metrics" id="accountMetrics"></div>
        <div class="top-actions">
          <button class="button button-primary" type="button" id="refreshButton">重新整理</button>
          <button class="button button-google" type="button" id="linkGoogleButton">連結 Google</button>
          <button class="button button-discord" type="button" id="linkDiscordButton">連結 Discord</button>
          <button class="button button-danger" type="button" id="logoutAllButton">登出所有裝置</button>
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>已連結身份</h2>
        </div>
        <div class="identity-list" id="identityList"></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>目前裝置</h2>
        </div>
        <div id="currentDevice"></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>已登入裝置</h2>
        </div>
        <div class="device-list" id="deviceList"></div>
      </section>
    </section>
  </main>

  <script>
    const AUTH_TOKEN_COOKIE_NAME = "yabus_auth_token";
    const STORAGE_KEYS = Object.freeze({
      authSession: "yabus_auth_session",
      deviceKey: "yabus_device_key",
    });

    const state = {
      session: readSession() || restoreSessionFromCookie(),
      account: null,
      devices: [],
      notice: null,
      mergePreview: null,
      busy: false,
    };

    function uuidv4() {
      return "10000000-1000-4000-8000-100000000000".replace(/[018]/g, (c) =>
        (Number(c) ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (Number(c) / 4)))).toString(16)
      );
    }

    function ensureDeviceKey() {
      const stored = localStorage.getItem(STORAGE_KEYS.deviceKey);
      if (stored) {
        return stored;
      }
      const generated = uuidv4();
      localStorage.setItem(STORAGE_KEYS.deviceKey, generated);
      return generated;
    }

    function readSession() {
      const raw = localStorage.getItem(STORAGE_KEYS.authSession);
      if (!raw) {
        return null;
      }
      try {
        return JSON.parse(raw);
      } catch {
        localStorage.removeItem(STORAGE_KEYS.authSession);
        return null;
      }
    }

    function readAuthTokenCookie() {
      const prefix = `${AUTH_TOKEN_COOKIE_NAME}=`;
      const match = document.cookie.split("; ").find((entry) => entry.startsWith(prefix));
      if (!match) {
        return "";
      }
      return decodeURIComponent(match.slice(prefix.length));
    }

    function setAuthTokenCookie(token) {
      document.cookie = `${AUTH_TOKEN_COOKIE_NAME}=${encodeURIComponent(token)}; Path=/; Max-Age=2592000; SameSite=Lax`;
    }

    function clearAuthTokenCookie() {
      document.cookie = `${AUTH_TOKEN_COOKIE_NAME}=; Path=/; Max-Age=0; SameSite=Lax`;
    }

    function restoreSessionFromCookie() {
      const token = readAuthTokenCookie();
      if (!token) {
        return null;
      }
      const session = {
        token,
        accountId: "",
        deviceId: "",
        role: "user",
        provider: "",
        displayName: "",
        storedAt: Date.now(),
      };
      localStorage.setItem(STORAGE_KEYS.authSession, JSON.stringify(session));
      return session;
    }

    function writeSession(session) {
      state.session = session;
      if (!session) {
        localStorage.removeItem(STORAGE_KEYS.authSession);
        clearAuthTokenCookie();
        return;
      }
      localStorage.setItem(STORAGE_KEYS.authSession, JSON.stringify(session));
      setAuthTokenCookie(session.token);
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      }[char]));
    }

    function providerLabel(provider) {
      return provider === "google" ? "Google" : provider === "discord" ? "Discord" : provider || "Unknown";
    }

    function providerClass(provider) {
      return provider === "google" ? "pill-google" : provider === "discord" ? "pill-discord" : "";
    }

    function formatTime(epochSeconds) {
      if (!epochSeconds) {
        return "-";
      }
      return new Date(Number(epochSeconds) * 1000).toLocaleString("zh-TW", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
      });
    }

    function maskDeviceKey(value) {
      if (!value) {
        return "-";
      }
      if (value.length <= 18) {
        return value;
      }
      return `${value.slice(0, 8)}...${value.slice(-8)}`;
    }

    function authHeaders() {
      if (!state.session || !state.session.token) {
        return {};
      }
      return { Authorization: `Bearer ${state.session.token}` };
    }

    async function requestJson(url, options = {}) {
      const response = await fetch(url, options);
      const isJson = (response.headers.get("content-type") || "").includes("application/json");
      const payload = isJson ? await response.json() : null;
      if (!response.ok) {
        if (response.status === 401) {
          writeSession(null);
          if (window.location.pathname === "/account") {
            window.location.replace("/auth");
          }
        }
        const message = payload && payload.detail ? payload.detail : `HTTP ${response.status}`;
        throw new Error(message);
      }
      return payload;
    }

    function setBusy(value) {
      state.busy = value;
      render();
    }

    function setNotice(tone, title, message) {
      state.mergePreview = null;
      state.notice = { tone, title, message };
      renderNotice();
    }

    function clearNotice() {
      state.notice = null;
      state.mergePreview = null;
      renderNotice();
    }

    function parseFragment() {
      const params = new URLSearchParams(window.location.hash.startsWith("#") ? window.location.hash.slice(1) : "");
      if (!window.location.hash) {
        return params;
      }
      history.replaceState(null, "", window.location.pathname + window.location.search);
      return params;
    }

    async function handleFragmentState() {
      const params = parseFragment();
      const error = params.get("error");
      if (error) {
        setNotice("error", "流程沒有完成", error);
        return;
      }

      const linkStatus = params.get("link_status");
      const provider = params.get("provider");
      const mergeToken = params.get("merge_token");

      if (linkStatus === "linked") {
        setNotice("success", "連結完成", `${providerLabel(provider)} 已掛到目前帳號。`);
        await refreshData();
        return;
      }

      if (linkStatus === "already_linked") {
        setNotice("info", "不需要再次連結", `${providerLabel(provider)} 已經在這個帳號上。`);
        await refreshData();
        return;
      }

      if (linkStatus === "merge_required" && mergeToken) {
        await loadMergePreview(mergeToken);
      }
    }

    async function refreshData() {
      if (!state.session || !state.session.token) {
        state.account = null;
        state.devices = [];
        render();
        return;
      }

      setBusy(true);
      try {
        const [account, devices] = await Promise.all([
          requestJson("/api/v1/auth/me", { headers: authHeaders() }),
          requestJson("/api/v1/auth/devices", { headers: authHeaders() }),
        ]);
        state.account = account;
        state.devices = devices.devices || [];
      } catch (error) {
        state.account = null;
        state.devices = [];
        setNotice("error", "無法載入帳戶資料", error.message || String(error));
      } finally {
        setBusy(false);
        render();
      }
    }

    async function startLink(provider) {
      setBusy(true);
      try {
        const payload = await requestJson(`/api/v1/auth/link/${provider}-start`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            ...authHeaders(),
          },
          body: JSON.stringify({ platform: "web" }),
        });
        window.location.href = payload.authorization_url;
      } catch (error) {
        setBusy(false);
        setNotice("error", "無法開始連結", error.message || String(error));
      }
    }

    async function loadMergePreview(mergeToken) {
      setBusy(true);
      try {
        const preview = await requestJson(`/api/v1/auth/link/pending?merge_token=${encodeURIComponent(mergeToken)}`, {
          headers: authHeaders(),
        });
        state.notice = null;
        state.mergePreview = {
          ...preview,
          merge_token: mergeToken,
        };
      } catch (error) {
        setNotice("error", "無法取得連結確認資訊", error.message || String(error));
      } finally {
        setBusy(false);
        renderNotice();
      }
    }

    async function confirmMerge() {
      if (!state.mergePreview) {
        return;
      }
      setBusy(true);
      try {
        const result = await requestJson("/api/v1/auth/link/confirm", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            ...authHeaders(),
          },
          body: JSON.stringify({ merge_token: state.mergePreview.merge_token }),
        });
        setNotice("success", "帳號已合併", `${providerLabel(result.provider)} 已被移到目前帳號，來源帳號已刪除。`);
        await refreshData();
      } catch (error) {
        setNotice("error", "無法完成合併", error.message || String(error));
      } finally {
        setBusy(false);
      }
    }

    async function logoutCurrentDevice() {
      if (!state.session || !state.session.token) {
        return;
      }
      setBusy(true);
      try {
        await requestJson("/api/v1/auth/logout", {
          method: "POST",
          headers: authHeaders(),
        });
        writeSession(null);
        state.account = null;
        state.devices = [];
        window.location.replace("/auth");
      } catch (error) {
        setNotice("error", "登出失敗", error.message || String(error));
      } finally {
        setBusy(false);
        render();
      }
    }

    async function logoutAllDevices() {
      if (!state.session || !state.session.token) {
        return;
      }
      setBusy(true);
      try {
        await requestJson("/api/v1/auth/logout-all", {
          method: "POST",
          headers: authHeaders(),
        });
        writeSession(null);
        state.account = null;
        state.devices = [];
        window.location.replace("/auth");
      } catch (error) {
        setNotice("error", "無法登出所有裝置", error.message || String(error));
      } finally {
        setBusy(false);
        render();
      }
    }

    function renderHeroBadge() {
      const badge = document.getElementById("heroBadge");
      if (!state.session || !state.session.token) {
        badge.textContent = "尚未登入";
        return;
      }
      badge.textContent = `${providerLabel(state.session.provider)} / ${state.session.displayName || "已登入"}`;
    }

    function renderNotice() {
      const panel = document.getElementById("noticePanel");
      if (state.mergePreview) {
        const identities = (state.mergePreview.source_identities || [])
          .map((identity) => providerLabel(identity.provider))
          .join(" , ");
        panel.hidden = false;
        panel.className = "panel notice notice-warning";
        panel.innerHTML = [
          `<h2>這個 ${escapeHtml(providerLabel(state.mergePreview.provider))} 已經掛在別的帳號上</h2>`,
          `<p>確認後，來源帳號 <span class="mono">${escapeHtml(state.mergePreview.source_account_id)}</span> 會被刪除。</p>`,
          `<p>來源帳號目前還有 ${escapeHtml(String((state.mergePreview.source_identities || []).length))} 個登入身份、${escapeHtml(String(state.mergePreview.active_device_count || 0))} 台仍登入中的裝置。</p>`,
          `<div class="notice-actions"><button class="button button-danger" type="button" id="confirmMergeButton">確認連結並刪除來源帳號</button><button class="button button-ghost" type="button" id="cancelMergeButton">取消</button></div>`,
        ].join("");
        document.getElementById("confirmMergeButton").addEventListener("click", confirmMerge);
        document.getElementById("cancelMergeButton").addEventListener("click", clearNotice);
        return;
      }

      if (!state.notice) {
        panel.hidden = true;
        panel.innerHTML = "";
        return;
      }

      panel.hidden = false;
      panel.className = `panel notice notice-${state.notice.tone}`;
      panel.innerHTML = [
        `<h2>${escapeHtml(state.notice.title)}</h2>`,
        `<p>${escapeHtml(state.notice.message)}</p>`,
      ].join("");
    }

    function renderAccountMetrics() {
      const root = document.getElementById("accountMetrics");
      if (!state.account) {
        root.innerHTML = "<div class=\"empty\">尚未取得帳戶資料。</div>";
        return;
      }

      const metrics = [
        ["帳號 ID", state.account.account_id],
        ["權限", state.account.role],
        ["建立時間", formatTime(state.account.created_at)],
        ["更新時間", formatTime(state.account.updated_at)],
      ];

      root.innerHTML = metrics.map(([label, value]) => `
        <article class="metric">
          <strong>${escapeHtml(label)}</strong>
          <span>${escapeHtml(value || "-")}</span>
        </article>
      `).join("");
    }

    function renderIdentities() {
      const root = document.getElementById("identityList");
      const identities = state.account && Array.isArray(state.account.identities) ? state.account.identities : [];
      if (!identities.length) {
        root.innerHTML = '<div class="empty">空空如也</div>';
        return;
      }
      root.innerHTML = identities.map((identity) => `
        <article class="identity">
          <div class="identity-head">
            <h3>${escapeHtml(identity.display_name || providerLabel(identity.provider))}</h3>
            <span class="pill ${providerClass(identity.provider)}">${escapeHtml(providerLabel(identity.provider))}</span>
          </div>
          <p>${escapeHtml(identity.email || "沒有 email")}</p>
          <p class="mono">${escapeHtml(identity.provider_user_id || "-")}</p>
        </article>
      `).join("");
    }

    function renderCurrentDevice() {
      const root = document.getElementById("currentDevice");
      if (!state.account || !state.account.device) {
        root.innerHTML = '<div class="empty">沒有目前裝置資訊。</div>';
        return;
      }
      const device = state.account.device;
      const deviceLabel = device.device_name ? `${escapeHtml(device.device_name)}（這台裝置）` : "這台裝置";
      root.innerHTML = `
        <article class="device">
          <div class="device-head">
            <h3>${deviceLabel}</h3>
          </div>
          <p class="mono">${escapeHtml(maskDeviceKey(device.device_key))}</p>
          <p>建立：${escapeHtml(formatTime(device.created_at))}</p>
          <p>最近使用：${escapeHtml(formatTime(device.last_seen_at))}</p>
        </article>
      `;
    }

    function renderDevices() {
      const root = document.getElementById("deviceList");
      if (!state.devices.length) {
        root.innerHTML = '<div class="empty">空空如也</div>';
        return;
      }
      root.innerHTML = state.devices.map((device) => `
        <article class="device">
          <div class="device-head">
            <h3>${escapeHtml(device.device_name || "未知裝置")}</h3>
            ${device.is_current ? "<span class='pill'>目前裝置</span>" : ""}
          </div>
          <p class="mono">${escapeHtml(maskDeviceKey(device.device_key))}</p>
          <p>裝置 ID：${escapeHtml(device.device_id)}</p>
          <p>登入時間：${escapeHtml(formatTime(device.token_created_at))}</p>
          <p>最近活動：${escapeHtml(formatTime(device.token_last_used_at || device.last_seen_at))}</p>
        </article>
      `).join("");
    }

    function renderButtons() {
      const linkedProviders = new Set((state.account && state.account.identities || []).map((identity) => identity.provider));
      const linkGoogleButton = document.getElementById("linkGoogleButton");
      const linkDiscordButton = document.getElementById("linkDiscordButton");
      const refreshButton = document.getElementById("refreshButton");
      const logoutButton = document.getElementById("logoutButton");
      const logoutAllButton = document.getElementById("logoutAllButton");

      linkGoogleButton.disabled = state.busy || linkedProviders.has("google");
      linkDiscordButton.disabled = state.busy || linkedProviders.has("discord");
      refreshButton.disabled = state.busy;
      logoutButton.disabled = state.busy;
      logoutAllButton.disabled = state.busy;

      linkGoogleButton.textContent = linkedProviders.has("google") ? "Google 已連結" : "連結 Google";
      linkDiscordButton.textContent = linkedProviders.has("discord") ? "Discord 已連結" : "連結 Discord";
    }

    function render() {
      renderHeroBadge();
      renderNotice();

      renderAccountMetrics();
      renderIdentities();
      renderCurrentDevice();
      renderDevices();
      renderButtons();
    }

    document.getElementById("refreshButton").addEventListener("click", refreshData);
    document.getElementById("linkGoogleButton").addEventListener("click", () => startLink("google"));
    document.getElementById("linkDiscordButton").addEventListener("click", () => startLink("discord"));
    document.getElementById("logoutButton").addEventListener("click", logoutCurrentDevice);
    document.getElementById("logoutAllButton").addEventListener("click", logoutAllDevices);

    ensureDeviceKey();
    render();
    refreshData().then(handleFragmentState);
  </script>
</body>

</html>
