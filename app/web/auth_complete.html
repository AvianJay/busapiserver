<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YABus 登入完成</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0b0f1a;
      --surface: rgba(255, 255, 255, 0.04);
      --surface-hover: rgba(255, 255, 255, 0.07);
      --ink: #f0f2f5;
      --ink-secondary: #94a3b8;
      --muted: #64748b;
      --line: rgba(255, 255, 255, 0.08);
      --line-strong: rgba(255, 255, 255, 0.14);
      --success: #34d399;
      --error: #f87171;
      --accent: #6ee7b7;
      --radius: 20px;
      --radius-sm: 14px;
      --radius-xs: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      background: var(--bg-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 50% -10%, rgba(52, 211, 153, 0.14), transparent),
        radial-gradient(ellipse 50% 40% at 80% 80%, rgba(167, 139, 250, 0.08), transparent);
      pointer-events: none;
      z-index: 0;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(540px, 100%);
      padding: 36px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: grid;
      gap: 20px;
      animation: fadeInUp 0.5s ease both;
    }

    h1 {
      margin: 0;
      font-weight: 700;
      letter-spacing: -0.02em;
      font-size: clamp(26px, 5vw, 40px);
      line-height: 1.1;
      background: linear-gradient(135deg, #f0f2f5 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p {
      margin: 0;
      color: var(--ink-secondary);
      line-height: 1.7;
      font-size: 14px;
    }

    .status {
      padding: 20px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: var(--surface-hover);
      font-size: 14px;
      line-height: 1.6;
    }

    .status strong {
      display: block;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .status div {
      color: var(--ink-secondary);
      font-size: 13px;
    }

    .status-success {
      border-color: rgba(52, 211, 153, 0.25);
      background: rgba(52, 211, 153, 0.08);
    }
    .status-success strong { color: var(--success); }

    .status-error {
      border-color: rgba(248, 113, 113, 0.25);
      background: rgba(248, 113, 113, 0.08);
    }
    .status-error strong { color: var(--error); }

    .actions {
      display: grid;
      gap: 12px;
    }

    .button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 48px;
      padding: 12px 18px;
      border-radius: var(--radius-xs);
      font: inherit;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .button:hover { transform: translateY(-1px); }

    .button-primary {
      color: #0b0f1a;
      background: linear-gradient(135deg, var(--accent), #34d399);
      box-shadow: 0 4px 20px rgba(110, 231, 183, 0.25);
    }
    .button-primary:hover {
      box-shadow: 0 8px 30px rgba(110, 231, 183, 0.35);
    }

    .button-secondary {
      border-color: var(--line-strong);
      color: var(--ink-secondary);
      background: transparent;
    }
    .button-secondary:hover {
      background: var(--surface-hover);
      color: var(--ink);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1 id="title">處理登入結果中</h1>
    <p id="subtitle">正在接收 OAuth callback。</p>
    <section class="status" id="statusBox"></section>
    <div class="actions">
      <a class="button button-primary" href="/account">前往帳戶頁</a>
      <a class="button button-secondary" href="/auth">回到登入頁</a>
    </div>
  </main>

  <script>
    const AUTH_TOKEN_COOKIE_NAME = "yabus_auth_token";
    const STORAGE_KEYS = Object.freeze({
      authSession: "yabus_auth_session",
    });

    function setAuthTokenCookie(token) {
      document.cookie = `${AUTH_TOKEN_COOKIE_NAME}=${encodeURIComponent(token)}; Path=/; Max-Age=2592000; SameSite=Lax`;
    }

    function clearAuthTokenCookie() {
      document.cookie = `${AUTH_TOKEN_COOKIE_NAME}=; Path=/; Max-Age=0; SameSite=Lax`;
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      }[char]));
    }

    function readHashParams() {
      return new URLSearchParams(window.location.hash.startsWith("#") ? window.location.hash.slice(1) : "");
    }

    function saveSession(params) {
      const token = params.get("token");
      if (!token) {
        return null;
      }
      const session = {
        token,
        accountId: params.get("account_id") || "",
        deviceId: params.get("device_id") || "",
        role: params.get("role") || "user",
        provider: params.get("provider") || "",
        displayName: params.get("display_name") || "",
        storedAt: Date.now(),
      };
      localStorage.setItem(STORAGE_KEYS.authSession, JSON.stringify(session));
      setAuthTokenCookie(token);
      return session;
    }

    function showStatus(kind, title, subtitle, body) {
      document.getElementById("title").textContent = title;
      document.getElementById("subtitle").textContent = subtitle;
      const box = document.getElementById("statusBox");
      box.className = `status ${kind === "error" ? "status-error" : "status-success"}`;
      box.innerHTML = body;
    }

    (function init() {
      const params = readHashParams();
      const error = params.get("error");
      const session = saveSession(params);
      if (window.location.hash) {
        history.replaceState(null, "", window.location.pathname + window.location.search);
      }

      if (error) {
        clearAuthTokenCookie();
        showStatus(
          "error",
          "登入沒有完成",
          "OAuth 流程回傳了錯誤。",
          `<strong>錯誤原因：</strong> ${escapeHtml(error)}`,
        );
        return;
      }

      if (!session) {
        clearAuthTokenCookie();
        showStatus(
          "error",
          "沒有收到登入資訊",
          "Callback 已抵達，但 fragment 內沒有 token。",
          "請回到登入頁重試。",
        );
        return;
      }

      showStatus(
        "success",
        "登入完成",
        "登入資訊已寫入本機，準備切到帳戶頁。",
        [
          `<strong>${escapeHtml(session.displayName || "YABus 使用者")}</strong>`,
          `<div>登入方式：${escapeHtml(session.provider || "unknown")}</div>`,
          `<div>帳號 ID：${escapeHtml(session.accountId || "-")}</div>`,
        ].join(""),
      );

      window.setTimeout(() => {
        window.location.replace("/account");
      }, 1100);
    }());
  </script>
</body>
</html>
