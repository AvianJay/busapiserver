<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YABus Redirect</title>
  
  <!-- Load Roboto Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

  <!-- Import Maps for @material/web -->
  <script type="importmap">
    {
      "imports": {
        "@material/web/": "https://esm.run/@material/web/"
      }
    }
  </script>

  <!-- Import Material Web Components Modules -->
  <script type="module">
    import '@material/web/all.js';
    import {styles as typescaleStyles} from '@material/web/typography/md-typescale-styles.js';
    document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
  </script>

  <style>
    :root {
      /* M3 Dark Palette */
      --md-sys-color-primary: #80f3d6;
      --md-sys-color-on-primary: #00382d;
      --md-sys-color-primary-container: #005142;
      --md-sys-color-on-primary-container: #9dfad7;
      --md-sys-color-surface: #0f1418;
      --md-sys-color-on-surface: #e1e3e0;
      --md-sys-color-surface-container: #202327;
      --md-sys-color-outline-variant: #3f4946;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Roboto, system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      padding: 24px;
      text-align: center;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    md-circular-progress {
      --md-circular-progress-active-indicator-color: var(--md-sys-color-primary);
      --md-circular-progress-size: 48px;
    }

    a {
      color: var(--md-sys-color-primary);
      text-decoration: none;
      font-size: 14px;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <md-circular-progress indeterminate></md-circular-progress>
    <div class="md-typescale-body-large">正在跳轉...</div>
    <a href="/account" class="md-typescale-label-large">若未自動跳轉，請點擊此處</a>
  </main>

  <script>
    const AUTH_TOKEN_COOKIE_NAME = "yabus_auth_token";
    const STORAGE_KEYS = { authSession: "yabus_auth_session" };

    function setAuthTokenCookie(token) {
      document.cookie = `${AUTH_TOKEN_COOKIE_NAME}=${encodeURIComponent(token)}; Path=/; Max-Age=2592000; SameSite=Lax`;
    }

    function readHashParams() {
      return new URLSearchParams(window.location.hash.startsWith("#") ? window.location.hash.slice(1) : "");
    }

    (function init() {
      const params = readHashParams();
      const token = params.get("token");
      const error = params.get("error");

      if (window.location.hash) {
        history.replaceState(null, "", window.location.pathname + window.location.search);
      }

      if (token && !error) {
        const session = {
          token,
          accountId: params.get("account_id") || "",
          deviceId: params.get("device_id") || "",
          role: params.get("role") || "user",
          provider: params.get("provider") || "",
          displayName: params.get("display_name") || "",
          storedAt: Date.now(),
        };
        localStorage.setItem(STORAGE_KEYS.authSession, JSON.stringify(session));
        setAuthTokenCookie(token);
      }

      window.location.replace("/account");
    })();
  </script>
</body>
</html>
