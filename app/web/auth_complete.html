<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YABus Redirect</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #0b0f1a;
      color: #94a3b8;
    }
    a { color: #6ee7b7; text-decoration: none; }
  </style>
</head>
<body>
  <a href="/account">正在跳轉... 若未自動跳轉，請點擊此處</a>

  <script>
    const AUTH_TOKEN_COOKIE_NAME = "yabus_auth_token";
    const STORAGE_KEYS = { authSession: "yabus_auth_session" };

    function setAuthTokenCookie(token) {
      document.cookie = `${AUTH_TOKEN_COOKIE_NAME}=${encodeURIComponent(token)}; Path=/; Max-Age=2592000; SameSite=Lax`;
    }

    function readHashParams() {
      return new URLSearchParams(window.location.hash.startsWith("#") ? window.location.hash.slice(1) : "");
    }

    (function init() {
      const params = readHashParams();
      const token = params.get("token");
      const error = params.get("error");

      if (window.location.hash) {
        history.replaceState(null, "", window.location.pathname + window.location.search);
      }

      if (token && !error) {
        const session = {
          token,
          accountId: params.get("account_id") || "",
          deviceId: params.get("device_id") || "",
          role: params.get("role") || "user",
          provider: params.get("provider") || "",
          displayName: params.get("display_name") || "",
          storedAt: Date.now(),
        };
        localStorage.setItem(STORAGE_KEYS.authSession, JSON.stringify(session));
        setAuthTokenCookie(token);
      }

      window.location.replace("/account");
    })();
  </script>
</body>
</html>
