<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YABus Feedback Inbox</title>
  
  <!-- Load Roboto Font & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

  <!-- Define the Import Map -->
  <script type="importmap">
    {
      "imports": {
        "@material/web/": "https://esm.run/@material/web/"
      }
    }
  </script>

  <!-- Import Material Web Components Modules -->
  <script type="module">
    import '@material/web/all.js';
    import {styles as typescaleStyles} from '@material/web/typography/md-typescale-styles.js';
    if (document.adoptedStyleSheets) {
      document.adoptedStyleSheets = [...document.adoptedStyleSheets, typescaleStyles.styleSheet];
    }
  </script>

  <style>
    :root {
      /* M3 Dark Palette */
      --md-sys-color-primary: #80f3d6;
      --md-sys-color-on-primary: #00382d;
      --md-sys-color-primary-container: #005142;
      --md-sys-color-on-primary-container: #9dfad7;
      --md-sys-color-secondary: #b0ccc2;
      --md-sys-color-on-secondary: #1b352e;
      --md-sys-color-surface: #0f1418;
      --md-sys-color-on-surface: #e1e3e0;
      --md-sys-color-surface-container: #202327;
      --md-sys-color-surface-container-high: #2a2d32;
      --md-sys-color-outline: #8a928f;
      --md-sys-color-outline-variant: #3f4946;
      --md-sys-color-error: #ffb4ab;
      --md-sys-color-on-error: #690005;
      --md-sys-color-error-container: #93000a;
      --md-sys-color-on-error-container: #ffdad6;
    }

    * {
      box-sizing: border-box;
    }

    body, h1, h2, h3, p, ul, ol, li, form, label {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      font-family: Roboto, system-ui, -apple-system, sans-serif;
      padding-bottom: 60px;
    }

    /* Tabs Styling */
    md-tabs {
      background-color: var(--md-sys-color-surface-container);
      --md-tabs-active-tab-indicator-color: var(--md-sys-color-primary);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    md-primary-tab {
      --md-primary-tab-active-label-text-color: var(--md-sys-color-primary);
      --md-primary-tab-active-icon-color: var(--md-sys-color-primary);
      --md-primary-tab-label-text-color: var(--md-sys-color-outline);
      --md-primary-tab-icon-color: var(--md-sys-color-outline);
      font-family: Roboto, system-ui;
    }

    /* Layout Containers */
    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .header-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .search-bar-container {
      width: 100%;
      max-width: 400px;
    }

    md-outlined-text-field {
      width: 100%;
      --md-outlined-text-field-container-shape: 12px;
    }

    /* M3 Card Styles */
    .m3-card {
      background-color: var(--md-sys-color-surface-container);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .m3-card-title {
      font-weight: 700;
      color: var(--md-sys-color-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Summary Metrics */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    .summary-item {
      background-color: var(--md-sys-color-surface-container-high);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .summary-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--md-sys-color-outline);
    }

    .summary-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--md-sys-color-on-surface);
    }

    /* Feedback list cards */
    .feedback-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .feedback-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
    }

    .feedback-meta {
      display: flex;
      gap: 12px;
      align-items: center;
      font-size: 13px;
      color: var(--md-sys-color-outline);
      margin-top: 4px;
    }

    .feedback-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .feedback-details {
      background-color: var(--md-sys-color-surface-container-high);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 13px;
    }

    .detail-row {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--md-sys-color-outline);
    }

    .detail-row md-icon {
      font-size: 18px;
      width: 18px;
      height: 18px;
    }

    .detail-badge {
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 11px;
    }

    .feedback-content {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
      line-height: 1.6;
      color: var(--md-sys-color-on-surface);
      border-left: 3px solid var(--md-sys-color-primary);
      padding-left: 12px;
      margin: 8px 0;
    }

    .feedback-ua {
      font-size: 11px;
      color: var(--md-sys-color-outline);
      word-break: break-all;
    }

    .notice {
      border-radius: 12px;
      padding: 16px;
      border: 1px solid rgba(248, 113, 113, 0.4);
      background-color: rgba(248, 113, 113, 0.1);
      color: #f87171;
      font-size: 14px;
    }

    .empty {
      color: var(--md-sys-color-outline);
      font-size: 13px;
      text-align: center;
      padding: 32px;
      border: 1px dashed var(--md-sys-color-outline-variant);
      border-radius: 12px;
    }

    .mono {
      font-family: monospace;
    }
  </style>
</head>
<body>
  
  <md-tabs id="adminTabs" active-tab-index="3">
    <md-primary-tab id="tabAnalytics">
      <md-icon slot="icon">analytics</md-icon>
      數據統計
    </md-primary-tab>
    <md-primary-tab id="tabAnnouncements">
      <md-icon slot="icon">campaign</md-icon>
      公告管理
    </md-primary-tab>
    <md-primary-tab id="tabUsers">
      <md-icon slot="icon">manage_accounts</md-icon>
      用戶管理
    </md-primary-tab>
    <md-primary-tab id="tabFeedbacks">
      <md-icon slot="icon">inbox</md-icon>
      意見回饋
    </md-primary-tab>
    <md-primary-tab id="tabAccount">
      <md-icon slot="icon">account_circle</md-icon>
      帳戶中心
    </md-primary-tab>
  </md-tabs>

  <main>
    <section class="header-panel">
      <div>
        <h1 class="md-typescale-headline-medium" style="font-weight: 700;">意見回饋收件箱</h1>
        <p class="md-typescale-body-medium" style="color: var(--md-sys-color-outline); margin-top: 4px;">
          集中查看 App 使用者送來的標題、內容、帳號與裝置資訊，方便快速分類與回覆。
        </p>
      </div>
      <div>
        <md-filled-button id="refreshButton" type="button">
          <md-icon slot="icon">refresh</md-icon>
          重新整理
        </md-filled-button>
      </div>
    </section>

    <div id="noticeRoot"></div>

    <section class="m3-card">
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
        <h2 class="m3-card-title md-typescale-title-medium">
          <md-icon>bar_chart</md-icon>
          數據摘要
        </h2>
        <div class="search-bar-container">
          <md-outlined-text-field id="searchInput" type="search" label="快速篩選">
            <md-icon slot="leading-icon">search</md-icon>
          </md-outlined-text-field>
        </div>
      </div>
      <div class="summary-grid" id="summaryGrid"></div>
    </section>

    <section class="m3-card">
      <h2 class="m3-card-title md-typescale-title-medium">
        <md-icon>list</md-icon>
        回饋列表 (<span id="countLabel">載入中…</span>)
      </h2>
      <div class="feedback-list" id="feedbackList">
        <div class="empty">正在抓取回饋資料…</div>
      </div>
    </section>
  </main>

  <script>
    const AUTH_TOKEN_COOKIE = "yabus_auth_token";
    const SESSION_KEY = "yabus_auth_session";
    let payload = { summary: null, feedbacks: [] };
    let keyword = "";

    function readSession() {
      const raw = localStorage.getItem(SESSION_KEY);
      if (!raw) return null;
      try { return JSON.parse(raw); } catch { return null; }
    }

    function readCookieToken() {
      const prefix = `${AUTH_TOKEN_COOKIE}=`;
      const found = document.cookie.split("; ").find((entry) => entry.startsWith(prefix));
      return found ? decodeURIComponent(found.slice(prefix.length)) : "";
    }

    function token() {
      const session = readSession();
      return (session && session.token) || readCookieToken() || "";
    }

    function authHeaders(extra = {}) {
      const current = token();
      return current ? { Authorization: `Bearer ${current}`, ...extra } : extra;
    }

    function escapeHtml(value) {
      const node = document.createElement("div");
      node.textContent = value || "";
      return node.innerHTML;
    }

    function formatTime(timestamp) {
      if (!timestamp) return "未記錄";
      return new Date(timestamp * 1000).toLocaleString("zh-TW", { timeZone: "Asia/Taipei" });
    }

    function clientLabel(entry) {
      const parts = [];
      if (entry.platform_name) parts.push(entry.platform_name);
      if (entry.app_version) parts.push(`App ${entry.app_version}`);
      if (!parts.length && entry.browser_name) parts.push(entry.browser_name);
      if (!parts.length && entry.client_family) parts.push(entry.client_family);
      return parts.join(" · ") || "unknown";
    }

    function showNotice(message) {
      const root = document.getElementById("noticeRoot");
      root.innerHTML = `<div class="notice">${escapeHtml(message)}</div>`;
    }

    function clearNotice() {
      document.getElementById("noticeRoot").innerHTML = "";
    }

    function renderSummary(summary) {
      const root = document.getElementById("summaryGrid");
      if (!summary) {
        root.innerHTML = "";
        return;
      }

      const cards = [
        ["總回饋數", summary.total_count || 0],
        ["近 24 小時", summary.recent_24h_count || 0],
        ["帳號數", summary.account_count || 0],
        ["最新一筆", formatTime(summary.last_created_at)],
      ];
      root.innerHTML = cards.map(([label, value]) => `
        <article class="summary-item">
          <span class="summary-label">${escapeHtml(label)}</span>
          <span class="summary-value">${escapeHtml(String(value))}</span>
        </article>
      `).join("");
    }

    function filteredFeedbacks() {
      if (!keyword) return payload.feedbacks;
      return payload.feedbacks.filter((entry) => {
        const haystack = [
          entry.title,
          entry.content,
          entry.account_id,
          entry.account_label,
          entry.account_email,
          entry.platform_name,
          entry.system_name,
          entry.browser_name,
          entry.user_agent,
        ]
          .filter(Boolean)
          .join("\n")
          .toLowerCase();
        return haystack.includes(keyword);
      });
    }

    function renderFeedbacks() {
      const list = document.getElementById("feedbackList");
      const feedbacks = filteredFeedbacks();
      document.getElementById("countLabel").textContent = `顯示 ${feedbacks.length} / ${payload.feedbacks.length} 筆`;
      if (!feedbacks.length) {
        list.innerHTML = '<div class="empty">目前沒有符合條件的回饋。</div>';
        return;
      }

      list.innerHTML = feedbacks.map((entry) => `
        <article class="m3-card" style="background-color: var(--md-sys-color-surface-container-high);">
          <div class="feedback-head">
            <div>
              <h3 class="md-typescale-title-medium" style="font-weight: 700;">${escapeHtml(entry.title)}</h3>
              <div class="feedback-meta">
                <span>${escapeHtml(formatTime(entry.created_at))}</span>
                <span class="mono">#${escapeHtml(entry.id)}</span>
              </div>
            </div>
            <div class="feedback-tags">
              <md-filter-chip label="${escapeHtml((entry.account_role || 'user').toLowerCase())}" selected style="--md-filter-chip-selected-container-color: var(--md-sys-color-primary-container); --md-filter-chip-selected-label-text-color: var(--md-sys-color-on-primary-container);"></md-filter-chip>
              <md-filter-chip label="${escapeHtml(clientLabel(entry))}"></md-filter-chip>
            </div>
          </div>
          
          <div class="feedback-details">
            <div class="detail-row">
              <md-icon>account_circle</md-icon>
              <span>帳號 ID: <span class="mono">${escapeHtml(entry.account_id)}</span></span>
              ${entry.account_label ? `<span class="detail-badge">${escapeHtml(entry.account_label)}</span>` : ""}
              ${entry.account_email ? `<span class="detail-badge">${escapeHtml(entry.account_email)}</span>` : ""}
            </div>
            ${entry.system_name ? `
            <div class="detail-row">
              <md-icon>phone_android</md-icon>
              <span>系統: ${escapeHtml(entry.system_name)}${entry.system_version ? ` ${escapeHtml(entry.system_version)}` : ""}</span>
            </div>` : ""}
            ${entry.browser_name ? `
            <div class="detail-row">
              <md-icon>language</md-icon>
              <span>瀏覽器: ${escapeHtml(entry.browser_name)}${entry.browser_version ? ` ${escapeHtml(entry.browser_version)}` : ""}</span>
            </div>` : ""}
          </div>

          <div class="feedback-content">${escapeHtml(entry.content)}</div>
          
          <div class="feedback-ua mono">${escapeHtml(entry.user_agent || "")}</div>
        </article>
      `).join("");
    }

    async function apiFetch(path) {
      const response = await fetch(path, { headers: authHeaders() });
      if (!response.ok) {
        const body = await response.json().catch(() => ({}));
        throw new Error(body.detail || `HTTP ${response.status}`);
      }
      return response.json();
    }

    async function loadFeedbacks() {
      try {
        clearNotice();
        payload = await apiFetch("/api/v1/admin/feedbacks?limit=500");
        renderSummary(payload.summary);
        renderFeedbacks();
      } catch (error) {
        showNotice(error.message || "載入失敗。");
        document.getElementById("feedbackList").innerHTML =
          '<div class="empty">目前無法載入回饋資料。</div>';
      }
    }

    document.getElementById("refreshButton").addEventListener("click", loadFeedbacks);
    document.getElementById("searchInput").addEventListener("input", (event) => {
      keyword = String(event.target.value || "").trim().toLowerCase();
      renderFeedbacks();
    });

    // Navigation setup
    document.getElementById("tabAnalytics").addEventListener("click", () => window.location.href = "/admin/analytics");
    document.getElementById("tabAnnouncements").addEventListener("click", () => window.location.href = "/admin/announcements");
    document.getElementById("tabUsers").addEventListener("click", () => window.location.href = "/admin/user_manage");
    document.getElementById("tabFeedbacks").addEventListener("click", () => window.location.href = "/admin/feedbacks");
    document.getElementById("tabAccount").addEventListener("click", () => window.location.href = "/account");

    if (!token()) {
      window.location.replace("/auth");
    } else {
      loadFeedbacks();
    }
  </script>
</body>
</html>
