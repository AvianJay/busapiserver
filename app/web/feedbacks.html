<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YABus Feedback Inbox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:
        radial-gradient(circle at top left, rgba(90, 156, 255, 0.18), transparent 30%),
        radial-gradient(circle at 82% 12%, rgba(245, 158, 11, 0.16), transparent 24%),
        linear-gradient(180deg, #0c1725 0%, #08111c 100%);
      --panel: rgba(10, 26, 42, 0.82);
      --panel-strong: rgba(12, 33, 54, 0.94);
      --border: rgba(163, 191, 250, 0.18);
      --border-strong: rgba(163, 191, 250, 0.3);
      --text: #f2f7ff;
      --muted: #9cb3d7;
      --accent: #7dd3fc;
      --accent-strong: #38bdf8;
      --accent-soft: rgba(125, 211, 252, 0.14);
      --warm: #fbbf24;
      --danger: #f87171;
      --ok: #34d399;
      --shadow: 0 28px 60px rgba(0, 0, 0, 0.28);
      --radius: 26px;
      --radius-sm: 18px;
      --radius-xs: 12px;
      --font-sans: "IBM Plex Sans", "Segoe UI Variable Text", system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", "Cascadia Code", ui-monospace, monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      line-height: 1.55;
    }

    main {
      width: min(1260px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 28px 0 44px;
      display: grid;
      gap: 18px;
    }

    .hero,
    .panel {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .hero {
      padding: 28px;
      display: grid;
      gap: 18px;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(11, 28, 44, 0.96), rgba(14, 36, 56, 0.82)),
        var(--panel);
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 320px;
      height: 320px;
      right: -70px;
      top: -150px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(125, 211, 252, 0.22), transparent 72%);
      pointer-events: none;
    }

    .hero-top,
    .hero-actions,
    .toolbar,
    .toolbar-search,
    .feedback-head,
    .feedback-meta,
    .summary-grid {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .hero-top,
    .toolbar,
    .feedback-head {
      justify-content: space-between;
    }

    .hero-copy {
      max-width: 780px;
      position: relative;
      z-index: 1;
      display: grid;
      gap: 10px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      letter-spacing: 0.08em;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      font-size: clamp(30px, 4vw, 48px);
      line-height: 0.98;
      letter-spacing: -0.04em;
    }

    h2 {
      font-size: 22px;
      letter-spacing: -0.03em;
    }

    h3 {
      font-size: 18px;
      letter-spacing: -0.02em;
    }

    p {
      color: var(--muted);
    }

    .button,
    input {
      font: inherit;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid transparent;
      text-decoration: none;
      color: var(--text);
      cursor: pointer;
      transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease;
    }

    .button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    .button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .button-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      color: #052031;
      font-weight: 700;
    }

    .button-secondary {
      border-color: var(--border-strong);
      background: rgba(255, 255, 255, 0.03);
    }

    .panel {
      padding: 22px;
      display: grid;
      gap: 18px;
    }

    .summary-grid {
      align-items: stretch;
    }

    .summary-card,
    .feedback-card {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: rgba(11, 33, 54, 0.74);
    }

    .summary-card {
      min-width: 180px;
      flex: 1 1 180px;
      padding: 18px;
      display: grid;
      gap: 4px;
    }

    .summary-card strong {
      font-size: 28px;
      letter-spacing: -0.04em;
    }

    .field {
      display: grid;
      gap: 6px;
      min-width: min(280px, 100%);
    }

    .field label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
    }

    .field input {
      min-height: 44px;
      padding: 10px 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(6, 17, 29, 0.54);
      color: var(--text);
      outline: none;
    }

    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(125, 211, 252, 0.12);
    }

    .feedback-list {
      display: grid;
      gap: 14px;
    }

    .feedback-card {
      padding: 20px;
      display: grid;
      gap: 14px;
    }

    .feedback-meta {
      color: var(--muted);
      font-size: 13px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      font-size: 12px;
      font-weight: 600;
    }

    .pill-role-admin {
      border-color: rgba(248, 113, 113, 0.28);
      color: #fecaca;
    }

    .pill-role-mod {
      border-color: rgba(251, 191, 36, 0.24);
      color: #fde68a;
    }

    .pill-role-user {
      border-color: rgba(52, 211, 153, 0.24);
      color: #bbf7d0;
    }

    .mono {
      font-family: var(--font-mono);
      font-size: 12px;
    }

    .feedback-content {
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text);
      font-size: 14px;
    }

    .notice,
    .empty {
      padding: 16px 18px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: rgba(10, 28, 45, 0.86);
    }

    .notice.error {
      border-color: rgba(248, 113, 113, 0.34);
      background: rgba(81, 23, 29, 0.52);
    }

    .empty {
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 720px) {
      main {
        width: calc(100vw - 20px);
        padding-top: 20px;
      }

      .hero,
      .panel {
        padding: 18px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <div class="hero-top">
        <div class="hero-copy">
          <div class="eyebrow">Feedback</div>
          <h1>意見回饋收件箱</h1>
          <p>集中查看 App 使用者送來的標題、內容、帳號與裝置資訊，方便快速分類與回覆。</p>
        </div>
      </div>
      <div class="hero-actions">
        <a class="button button-secondary" href="/admin/analytics">Analytics</a>
        <a class="button button-secondary" href="/admin/announcements">Announcements</a>
        <a class="button button-secondary" href="/admin/user_manage">Users</a>
        <a class="button button-secondary" href="/account">Account</a>
        <button class="button button-primary" id="refreshButton" type="button">重新整理</button>
      </div>
    </section>

    <section id="noticeRoot"></section>

    <section class="panel">
      <div class="toolbar">
        <div>
          <h2>摘要</h2>
          <p>最新 500 筆回饋，依時間由新到舊排序。</p>
        </div>
        <div class="toolbar-search">
          <div class="field">
            <label for="searchInput">快速篩選</label>
            <input id="searchInput" type="search" placeholder="搜尋標題、內容、帳號、平台" />
          </div>
        </div>
      </div>
      <div class="summary-grid" id="summaryGrid"></div>
    </section>

    <section class="panel">
      <div class="toolbar">
        <div>
          <h2>回饋列表</h2>
          <p id="countLabel">載入中…</p>
        </div>
      </div>
      <div class="feedback-list" id="feedbackList">
        <div class="empty">正在抓取回饋資料…</div>
      </div>
    </section>
  </main>

  <script>
    const AUTH_TOKEN_COOKIE = "yabus_auth_token";
    const SESSION_KEY = "yabus_auth_session";
    let payload = { summary: null, feedbacks: [] };
    let keyword = "";

    function readSession() {
      const raw = localStorage.getItem(SESSION_KEY);
      if (!raw) return null;
      try { return JSON.parse(raw); } catch { return null; }
    }

    function readCookieToken() {
      const prefix = `${AUTH_TOKEN_COOKIE}=`;
      const found = document.cookie.split("; ").find((entry) => entry.startsWith(prefix));
      return found ? decodeURIComponent(found.slice(prefix.length)) : "";
    }

    function token() {
      const session = readSession();
      return (session && session.token) || readCookieToken() || "";
    }

    function authHeaders(extra = {}) {
      const current = token();
      return current ? { Authorization: `Bearer ${current}`, ...extra } : extra;
    }

    function escapeHtml(value) {
      const node = document.createElement("div");
      node.textContent = value || "";
      return node.innerHTML;
    }

    function formatTime(timestamp) {
      if (!timestamp) return "未記錄";
      return new Date(timestamp * 1000).toLocaleString("zh-TW", { timeZone: "Asia/Taipei" });
    }

    function clientLabel(entry) {
      const parts = [];
      if (entry.platform_name) parts.push(entry.platform_name);
      if (entry.app_version) parts.push(`App ${entry.app_version}`);
      if (!parts.length && entry.browser_name) parts.push(entry.browser_name);
      if (!parts.length && entry.client_family) parts.push(entry.client_family);
      return parts.join(" · ") || "unknown";
    }

    function rolePill(role) {
      const normalized = (role || "user").toLowerCase();
      return `<span class="pill pill-role-${escapeHtml(normalized)}">${escapeHtml(normalized)}</span>`;
    }

    function showNotice(message, tone = "error") {
      const root = document.getElementById("noticeRoot");
      root.innerHTML = `<div class="notice ${tone}">${escapeHtml(message)}</div>`;
    }

    function clearNotice() {
      document.getElementById("noticeRoot").innerHTML = "";
    }

    function renderSummary(summary) {
      const root = document.getElementById("summaryGrid");
      if (!summary) {
        root.innerHTML = "";
        return;
      }

      const cards = [
        ["總回饋數", summary.total_count || 0],
        ["近 24 小時", summary.recent_24h_count || 0],
        ["有回饋的帳號數", summary.account_count || 0],
        ["最新一筆", formatTime(summary.last_created_at)],
      ];
      root.innerHTML = cards.map(([label, value]) => `
        <article class="summary-card">
          <p>${escapeHtml(label)}</p>
          <strong>${escapeHtml(String(value))}</strong>
        </article>
      `).join("");
    }

    function filteredFeedbacks() {
      if (!keyword) return payload.feedbacks;
      return payload.feedbacks.filter((entry) => {
        const haystack = [
          entry.title,
          entry.content,
          entry.account_id,
          entry.account_label,
          entry.account_email,
          entry.platform_name,
          entry.system_name,
          entry.browser_name,
          entry.user_agent,
        ]
          .filter(Boolean)
          .join("\n")
          .toLowerCase();
        return haystack.includes(keyword);
      });
    }

    function renderFeedbacks() {
      const list = document.getElementById("feedbackList");
      const feedbacks = filteredFeedbacks();
      document.getElementById("countLabel").textContent = `顯示 ${feedbacks.length} / ${payload.feedbacks.length} 筆`;
      if (!feedbacks.length) {
        list.innerHTML = '<div class="empty">目前沒有符合條件的回饋。</div>';
        return;
      }

      list.innerHTML = feedbacks.map((entry) => `
        <article class="feedback-card">
          <div class="feedback-head">
            <div>
              <h3>${escapeHtml(entry.title)}</h3>
              <div class="feedback-meta">
                <span>${escapeHtml(formatTime(entry.created_at))}</span>
                <span class="mono">#${escapeHtml(entry.id)}</span>
              </div>
            </div>
            <div class="feedback-meta">
              ${rolePill(entry.account_role)}
              <span class="pill">${escapeHtml(clientLabel(entry))}</span>
            </div>
          </div>
          <div class="feedback-meta">
            <span class="pill">帳號 ${escapeHtml(entry.account_id)}</span>
            ${entry.account_label ? `<span>${escapeHtml(entry.account_label)}</span>` : ""}
            ${entry.account_email ? `<span>${escapeHtml(entry.account_email)}</span>` : ""}
          </div>
          <div class="feedback-content">${escapeHtml(entry.content)}</div>
          <div class="feedback-meta">
            ${entry.system_name ? `<span>系統 ${escapeHtml(entry.system_name)}${entry.system_version ? ` ${escapeHtml(entry.system_version)}` : ""}</span>` : ""}
            ${entry.browser_name ? `<span>瀏覽器 ${escapeHtml(entry.browser_name)}${entry.browser_version ? ` ${escapeHtml(entry.browser_version)}` : ""}</span>` : ""}
          </div>
          <div class="feedback-meta mono">${escapeHtml(entry.user_agent || "")}</div>
        </article>
      `).join("");
    }

    async function apiFetch(path) {
      const response = await fetch(path, { headers: authHeaders() });
      if (!response.ok) {
        const body = await response.json().catch(() => ({}));
        throw new Error(body.detail || `HTTP ${response.status}`);
      }
      return response.json();
    }

    async function loadFeedbacks() {
      try {
        clearNotice();
        payload = await apiFetch("/api/v1/admin/feedbacks?limit=500");
        renderSummary(payload.summary);
        renderFeedbacks();
      } catch (error) {
        showNotice(error.message || "載入失敗。");
        document.getElementById("feedbackList").innerHTML =
          '<div class="empty">目前無法載入回饋資料。</div>';
      }
    }

    document.getElementById("refreshButton").addEventListener("click", loadFeedbacks);
    document.getElementById("searchInput").addEventListener("input", (event) => {
      keyword = String(event.target.value || "").trim().toLowerCase();
      renderFeedbacks();
    });

    if (!token()) {
      window.location.replace("/auth");
    } else {
      loadFeedbacks();
    }
  </script>
</body>
</html>
