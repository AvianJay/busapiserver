<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YABus 隱私權政策</title>
  
  <!-- Load Roboto Font & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

  <!-- Marked JS Library for Markdown Parsing -->
  <script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Define the Import Map -->
  <script type="importmap">
    {
      "imports": {
        "@material/web/": "https://esm.run/@material/web/"
      }
    }
  </script>

  <!-- Import Material Web Components Modules -->
  <script type="module">
    import '@material/web/all.js';
    import {styles as typescaleStyles} from '@material/web/typography/md-typescale-styles.js';
    if (document.adoptedStyleSheets) {
      document.adoptedStyleSheets = [...document.adoptedStyleSheets, typescaleStyles.styleSheet];
    }
  </script>

  <style>
    :root {
      /* M3 Dark Palette */
      --md-sys-color-primary: #80f3d6;
      --md-sys-color-on-primary: #00382d;
      --md-sys-color-primary-container: #005142;
      --md-sys-color-on-primary-container: #9dfad7;
      --md-sys-color-secondary: #b0ccc2;
      --md-sys-color-on-secondary: #1b352e;
      --md-sys-color-surface: #0f1418;
      --md-sys-color-on-surface: #e1e3e0;
      --md-sys-color-on-surface-variant: #c0c9c4;
      --md-sys-color-surface-container: #202327;
      --md-sys-color-surface-container-high: #2a2d32;
      --md-sys-color-outline: #8a928f;
      --md-sys-color-outline-variant: #3f4946;
      --md-sys-color-error: #ffb4ab;
      --md-sys-color-on-error: #690005;
      --md-sys-color-error-container: #93000a;
      --md-sys-color-on-error-container: #ffdad6;
    }

    * {
      box-sizing: border-box;
    }

    body, h1, h2, h3, p, ul, ol, li {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      font-family: Roboto, system-ui, -apple-system, sans-serif;
      padding-bottom: 60px;
    }

    /* Header Styling */
    header {
      background-color: var(--md-sys-color-surface-container);
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Layout Containers */
    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 24px;
    }

    .document-card {
      background-color: var(--md-sys-color-surface-container);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0px 4px 24px rgba(0, 0, 0, 0.2);
    }

    .error-box {
      border-radius: 12px;
      padding: 16px;
      border: 1px solid rgba(251, 113, 133, 0.4);
      background-color: rgba(251, 113, 133, 0.1);
      color: #fecdd3;
      margin-bottom: 16px;
      font-size: 14px;
    }

    /* Markdown Typography mapping */
    .document-body h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--md-sys-color-primary);
      margin-top: 24px;
      margin-bottom: 16px;
    }
    .document-body h2 {
      font-size: 20px;
      font-weight: 700;
      color: var(--md-sys-color-primary);
      margin-top: 20px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      padding-bottom: 8px;
    }
    .document-body h3 {
      font-size: 16px;
      font-weight: 700;
      color: var(--md-sys-color-on-surface);
      margin-top: 16px;
      margin-bottom: 8px;
    }
    .document-body p {
      font-size: 14px;
      line-height: 1.7;
      color: var(--md-sys-color-on-surface-variant);
      margin-bottom: 16px;
    }
    .document-body ul, .document-body ol {
      margin-bottom: 16px;
      padding-left: 24px;
    }
    .document-body li {
      font-size: 14px;
      line-height: 1.7;
      color: var(--md-sys-color-on-surface-variant);
      margin-bottom: 8px;
    }
    .document-body a {
      color: var(--md-sys-color-primary);
      text-decoration: none;
    }
    .document-body a:hover {
      text-decoration: underline;
    }
    .document-body code {
      background-color: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-primary);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 13px;
    }
    .document-body hr {
      border: 0;
      border-top: 1px solid var(--md-sys-color-outline-variant);
      margin: 24px 0;
    }

    .document-body.is-loading {
      color: var(--md-sys-color-outline);
      text-align: center;
      padding: 40px;
    }
  </style>
</head>

<body>
  <header>
    <div class="header-title-section">
      <h1 class="md-typescale-title-large" style="font-weight:700;">YABus 隱私權政策</h1>
    </div>
    <div class="header-actions">
      <md-outlined-button id="btnTOS">服務條款</md-outlined-button>
      <md-outlined-button id="btnAccount">帳戶中心</md-outlined-button>
    </div>
  </header>

  <main>
    <section class="document-card">
      <div id="errorBox" class="error-box" hidden></div>
      <article id="documentBody" class="document-body is-loading" aria-live="polite">正在載入...</article>
    </section>
  </main>

  <script>
    const DOCUMENT_CONFIG = Object.freeze({
      endpoint: "/api/v1/privacy-policy",
      rawHref: "/api/v1/privacy-policy",
    });

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      }[char]));
    }

    function renderMarkdown(content) {
      if (window.marked && typeof window.marked.parse === "function") {
        return window.marked.parse(content);
      }
      return `<pre>${escapeHtml(content)}</pre>`;
    }

    async function loadDocument() {
      const body = document.getElementById("documentBody");
      const errorBox = document.getElementById("errorBox");

      try {
        const response = await fetch(DOCUMENT_CONFIG.endpoint, {
          cache: "no-store",
          headers: { "Accept": "application/json" },
        });
        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload && payload.detail ? payload.detail : `HTTP ${response.status}`);
        }
        if (!payload || typeof payload.content !== "string") {
          throw new Error("API did not return a valid markdown payload.");
        }

        body.classList.remove("is-loading");
        body.innerHTML = renderMarkdown(payload.content);
        errorBox.hidden = true;
      } catch (error) {
        const message = error && error.message ? error.message : String(error);
        body.classList.remove("is-loading");
        body.innerHTML = `<pre>${escapeHtml(message)}</pre>`;
        errorBox.textContent = `無法載入隱私權政策：${message}`;
        errorBox.hidden = false;
      }
    }

    document.getElementById("btnTOS").addEventListener("click", () => window.location.href = "/terms-of-service");
    document.getElementById("btnAccount").addEventListener("click", () => window.location.href = "/account");

    window.addEventListener("DOMContentLoaded", loadDocument);
  </script>
</body>

</html>
