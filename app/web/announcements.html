<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>YABus 公告管理</title>
  
  <!-- Load Roboto Font & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

  <!-- Define the Import Map -->
  <script type="importmap">
    {
      "imports": {
        "@material/web/": "https://esm.run/@material/web/"
      }
    }
  </script>

  <!-- Import Material Web Components Modules -->
  <script type="module">
    import '@material/web/all.js';
    import {styles as typescaleStyles} from '@material/web/typography/md-typescale-styles.js';
    if (document.adoptedStyleSheets) {
      document.adoptedStyleSheets = [...document.adoptedStyleSheets, typescaleStyles.styleSheet];
    }
  </script>

  <style>
    :root {
      /* M3 Dark Palette */
      --md-sys-color-primary: #80f3d6;
      --md-sys-color-on-primary: #00382d;
      --md-sys-color-primary-container: #005142;
      --md-sys-color-on-primary-container: #9dfad7;
      --md-sys-color-secondary: #b0ccc2;
      --md-sys-color-on-secondary: #1b352e;
      --md-sys-color-surface: #0f1418;
      --md-sys-color-on-surface: #e1e3e0;
      --md-sys-color-surface-container: #202327;
      --md-sys-color-surface-container-high: #2a2d32;
      --md-sys-color-outline: #8a928f;
      --md-sys-color-outline-variant: #3f4946;
      --md-sys-color-error: #ffb4ab;
      --md-sys-color-on-error: #690005;
      --md-sys-color-error-container: #93000a;
      --md-sys-color-on-error-container: #ffdad6;
    }

    * {
      box-sizing: border-box;
    }

    body, h1, h2, h3, p, ul, ol, li, form, label {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      font-family: Roboto, system-ui, -apple-system, sans-serif;
      padding-bottom: 60px;
    }

    /* Tabs Styling */
    md-tabs {
      background-color: var(--md-sys-color-surface-container);
      --md-tabs-active-tab-indicator-color: var(--md-sys-color-primary);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    md-primary-tab {
      --md-primary-tab-active-label-text-color: var(--md-sys-color-primary);
      --md-primary-tab-active-icon-color: var(--md-sys-color-primary);
      --md-primary-tab-label-text-color: var(--md-sys-color-outline);
      --md-primary-tab-icon-color: var(--md-sys-color-outline);
      font-family: Roboto, system-ui;
    }

    /* Layout Containers */
    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .header-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    /* M3 Card Container Styling */
    .m3-card {
      background-color: var(--md-sys-color-surface-container);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .m3-card-title {
      font-weight: 700;
      color: var(--md-sys-color-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ann-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Dialog styling */
    md-dialog {
      --md-dialog-container-color: var(--md-sys-color-surface-container-high);
      max-width: 600px;
      width: 100%;
    }

    .dialog-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 16px 0;
    }

    .form-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 600px) {
      .form-row-2 {
        grid-template-columns: 1fr;
      }
    }

    md-outlined-text-field, md-outlined-select {
      width: 100%;
    }

    .notice {
      border-radius: 12px;
      padding: 16px;
      border: 1px solid var(--md-sys-color-outline-variant);
      margin-bottom: 16px;
    }

    .notice.notice-ok {
      background-color: rgba(52, 211, 153, 0.1);
      border-color: rgba(52, 211, 153, 0.4);
      color: #34d399;
    }

    .notice.notice-err {
      background-color: rgba(248, 113, 113, 0.1);
      border-color: rgba(248, 113, 113, 0.4);
      color: #f87171;
    }

    .notice h3 {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .notice p {
      font-size: 13px;
      margin: 0;
    }

    .content-preview {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .empty {
      color: var(--md-sys-color-outline);
      font-size: 13px;
      text-align: center;
      padding: 32px;
      border: 1px dashed var(--md-sys-color-outline-variant);
      border-radius: 12px;
    }

    .mono {
      font-family: monospace;
    }
  </style>
</head>
<body>

  <md-tabs id="adminTabs" active-tab-index="1">
    <md-primary-tab id="tabAnalytics">
      <md-icon slot="icon">analytics</md-icon>
      數據統計
    </md-primary-tab>
    <md-primary-tab id="tabAnnouncements">
      <md-icon slot="icon">campaign</md-icon>
      公告管理
    </md-primary-tab>
    <md-primary-tab id="tabUsers">
      <md-icon slot="icon">manage_accounts</md-icon>
      用戶管理
    </md-primary-tab>
    <md-primary-tab id="tabFeedbacks">
      <md-icon slot="icon">inbox</md-icon>
      意見回饋
    </md-primary-tab>
    <md-primary-tab id="tabAccount">
      <md-icon slot="icon">account_circle</md-icon>
      帳戶中心
    </md-primary-tab>
  </md-tabs>

  <main>
    <section class="header-panel">
      <div>
        <h1 class="md-typescale-headline-medium" style="font-weight: 800;">公告管理</h1>
        <p class="md-typescale-body-medium" style="color: var(--md-sys-color-outline); margin-top: 4px;">
          建立、編輯與管理應用程式內的公告。
        </p>
      </div>
      <div style="display: flex; gap: 12px; align-items: center;">
        <md-filled-button id="btnNew">
          <md-icon slot="icon">add</md-icon>
          新增公告
        </md-filled-button>
        <md-outlined-button id="btnRefresh">
          <md-icon slot="icon">refresh</md-icon>
          重新整理
        </md-outlined-button>
      </div>
    </section>

    <div id="noticeArea"></div>

    <section class="m3-card">
      <h2 class="m3-card-title md-typescale-title-medium">
        <md-icon>list</md-icon>
        所有公告 (<span id="countLabel">共 — 則</span>)
      </h2>
      <div class="ann-list" id="annList">
        <div class="empty">載入中…</div>
      </div>
    </section>
  </main>

  <!-- Editor Modal inside MD3 Dialog -->
  <md-dialog id="editorDialog">
    <div slot="headline" id="modalTitle">新增公告</div>
    <form slot="content" id="dialogForm" method="dialog" class="dialog-form">
      <md-outlined-text-field id="fId" label="ID（留空自動產生）" placeholder="my-announcement-id"></md-outlined-text-field>
      <md-outlined-text-field id="fTitle" required label="標題 *"></md-outlined-text-field>
      <md-outlined-text-field id="fContent" type="textarea" required label="內容 (Markdown) *" rows="5"></md-outlined-text-field>
      
      <div class="form-row-2">
        <md-outlined-text-field id="fAuthor" label="作者" placeholder="admin"></md-outlined-text-field>
        <md-outlined-text-field id="fSound" label="音效 URL" placeholder="https://..."></md-outlined-text-field>
      </div>
      
      <div class="form-row-2">
        <md-outlined-text-field id="fCreatedAt" type="number" label="建立時間 (Unix)"></md-outlined-text-field>
        <md-outlined-text-field id="fExpireAt" type="number" label="到期時間 (Unix)"></md-outlined-text-field>
      </div>
      
      <div class="form-row-2">
        <md-outlined-select id="fRedDot" label="紅點行為">
          <md-select-option value="none">none</md-select-option>
          <md-select-option value="once">once</md-select-option>
          <md-select-option value="forever">forever</md-select-option>
        </md-outlined-select>
        <md-outlined-select id="fPopup" label="彈出行為">
          <md-select-option value="none">none</md-select-option>
          <md-select-option value="once">once</md-select-option>
          <md-select-option value="forever">forever</md-select-option>
        </md-outlined-select>
      </div>
      
      <div id="pushField" style="margin-top: 8px;">
        <label style="display: flex; align-items: center; gap: 12px; cursor: pointer; color: var(--md-sys-color-on-surface);">
          <md-switch id="fSendPush"></md-switch>
          <span>建立後立即發送 FCM 推播（僅 Android / Web）</span>
        </label>
      </div>
      
      <md-outlined-text-field id="fPlatforms" label="目標平台（逗號分隔，空白=全平台）" placeholder="android, ios, web"></md-outlined-text-field>
      <md-outlined-text-field id="fVersion" label="版本限制" placeholder=">=1.2.0"></md-outlined-text-field>
      
      <div class="form-row-2">
        <md-outlined-text-field id="fEmbedType" label="Embed 類型" placeholder="image"></md-outlined-text-field>
        <md-outlined-text-field id="fEmbedUrl" label="Embed URL" placeholder="https://..."></md-outlined-text-field>
      </div>
      
      <md-outlined-text-field id="fActions" type="textarea" label="Actions (JSON 陣列)" placeholder='[{"type":"link","label":"了解更多","url":"https://..."}]' rows="2"></md-outlined-text-field>
    </form>
    <div slot="actions">
      <md-outlined-button id="btnCancel">取消</md-outlined-button>
      <md-outlined-button id="btnDelete" style="--md-outlined-button-outline-color: var(--md-sys-color-error); --md-outlined-button-label-text-color: var(--md-sys-color-error); display: none;">刪除 (過期)</md-outlined-button>
      <md-filled-button id="btnSave">儲存</md-filled-button>
    </div>
  </md-dialog>

  <script>
    const AUTH_TOKEN_COOKIE = "yabus_auth_token";
    const SESSION_KEY = "yabus_auth_session";
    let announcements = [];
    let editingId = null;

    function readSession() {
      const raw = localStorage.getItem(SESSION_KEY);
      if (!raw) return null;
      try { return JSON.parse(raw); } catch { return null; }
    }
    function readCookieToken() {
      const p = `${AUTH_TOKEN_COOKIE}=`;
      const m = document.cookie.split("; ").find(e => e.startsWith(p));
      return m ? decodeURIComponent(m.slice(p.length)) : "";
    }
    function token() {
      const s = readSession();
      return (s && s.token) || readCookieToken() || "";
    }
    function authHeaders() { const t = token(); return t ? { Authorization: `Bearer ${t}` } : {}; }

    function escapeHtml(s) {
      const d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML;
    }
    // Safe for values placed inside double-quoted HTML attributes (escapes quotes).
    function escapeAttr(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }
    function fmtTime(ts) {
      if (!ts) return "—";
      return new Date(ts * 1000).toLocaleString("zh-TW", { timeZone: "Asia/Taipei" });
    }

    async function apiFetch(path, opts = {}) {
      const res = await fetch(path, { ...opts, headers: { ...authHeaders(), ...(opts.headers || {}) } });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.detail || `HTTP ${res.status}`);
      }
      return res.status === 204 ? null : res.json();
    }

    function showNotice(tone, title, msg) {
      const a = document.getElementById("noticeArea");
      const cls = tone === "error" ? "notice-err" : "notice-ok";
      a.innerHTML = `<div class="notice ${cls}"><h3>${escapeHtml(title)}</h3><p>${escapeHtml(msg)}</p></div>`;
      setTimeout(() => { if (a.firstChild) a.innerHTML = ""; }, 6000);
    }

    function describePushResult(result) {
      if (!result || !result.attempted) return "";
      if (result.skipped) {
        return `推播未送出：${result.reason || "沒有符合的裝置或尚未完成 FCM 設定。"}`
      }
      const summary = `推播結果：成功 ${result.sent || 0}，失敗 ${result.failed || 0}`;
      if (result.invalidated) {
        return `${summary}，已清除 ${result.invalidated} 個失效 token。`;
      }
      if (result.reason) {
        return `${summary}。${result.reason}`;
      }
      return `${summary}。`;
    }

    function statusPill(ann) {
      const now = Math.floor(Date.now() / 1000);
      if (ann.expire_at && ann.expire_at <= now) {
        return `<md-filter-chip label="已過期" selected style="--md-filter-chip-selected-container-color: var(--md-sys-color-error-container); --md-filter-chip-selected-label-text-color: var(--md-sys-color-on-error-container);"></md-filter-chip>`;
      }
      if (ann.expire_at) {
        return `<md-filter-chip label="限時" selected style="--md-filter-chip-selected-container-color: rgba(251, 146, 60, 0.2); --md-filter-chip-selected-label-text-color: #fb923c;"></md-filter-chip>`;
      }
      return `<md-filter-chip label="啟用中" selected style="--md-filter-chip-selected-container-color: var(--md-sys-color-primary-container); --md-filter-chip-selected-label-text-color: var(--md-sys-color-on-primary-container);"></md-filter-chip>`;
    }

    function targetsPills(ann) {
      const parts = [];
      const t = ann.targets;
      if (t && t.platforms && t.platforms.length) {
        parts.push(...t.platforms.map(p => `<md-filter-chip label="${escapeAttr(p)}"></md-filter-chip>`));
      }
      if (t && t.version_constraint) {
        parts.push(`<md-filter-chip label="${escapeAttr(t.version_constraint)}"></md-filter-chip>`);
      }
      return parts.join("");
    }

    function renderList() {
      const root = document.getElementById("annList");
      document.getElementById("countLabel").textContent = `共 ${announcements.length} 則`;
      if (!announcements.length) { root.innerHTML = '<div class="empty">目前沒有任何公告。</div>'; return; }
      root.innerHTML = announcements.map(a => `
        <article class="m3-card card" data-id="${escapeAttr(a.id)}" style="cursor: pointer; background-color: var(--md-sys-color-surface-container-high);">
          <div class="card-head" style="display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;">
            <h3 class="md-typescale-title-medium" style="font-weight: 700; margin: 0;">${escapeHtml(a.title)}</h3>
            <div class="card-meta" style="display: flex; gap: 8px; align-items: center;">${statusPill(a)}${targetsPills(a)}</div>
          </div>
          <div class="content-preview" style="color: var(--md-sys-color-outline); margin: 8px 0; font-size: 13px;">${escapeHtml(a.content)}</div>
          <div class="card-meta" style="display: flex; gap: 16px; align-items: center; font-size: 11px; color: var(--md-sys-color-outline);">
            <span class="mono">${escapeHtml(a.id)}</span>
            <span>${escapeHtml(fmtTime(a.created_at))}</span>
            ${a.author ? `<span>by ${escapeHtml(a.author)}</span>` : ""}
          </div>
        </article>
      `).join("");
      root.querySelectorAll(".card").forEach(c => c.addEventListener("click", () => openEditor(c.dataset.id)));
    }

    async function loadAll() {
      try {
        announcements = await apiFetch("/api/v1/announcements/all");
        renderList();
      } catch (e) {
        showNotice("error", "載入失敗", e.message);
      }
    }

    function openEditor(id) {
      editingId = id || null;
      document.getElementById("modalTitle").textContent = id ? "編輯公告" : "新增公告";
      document.getElementById("btnDelete").style.display = id ? "inline-flex" : "none";
      document.getElementById("pushField").style.display = id ? "none" : "block";
      const ann = id ? announcements.find(a => a.id === id) : null;

      document.getElementById("fId").value = ann ? ann.id : "";
      document.getElementById("fId").disabled = !!id;
      document.getElementById("fTitle").value = ann ? ann.title : "";
      document.getElementById("fContent").value = ann ? ann.content : "";
      document.getElementById("fAuthor").value = ann ? (ann.author || "") : "";
      document.getElementById("fSound").value = ann ? (ann.sound_url || "") : "";
      document.getElementById("fCreatedAt").value = ann ? (ann.created_at || "") : "";
      document.getElementById("fExpireAt").value = ann ? (ann.expire_at || "") : "";
      document.getElementById("fRedDot").value = ann && ann.behavior ? ann.behavior.red_dot : "once";
      document.getElementById("fPopup").value = ann && ann.behavior ? ann.behavior.popup : "once";
      document.getElementById("fSendPush").checked = false;

      const targets = ann ? ann.targets : null;
      document.getElementById("fPlatforms").value = targets && targets.platforms ? targets.platforms.join(", ") : "";
      document.getElementById("fVersion").value = targets && targets.version_constraint ? targets.version_constraint : "";

      const embed = ann ? ann.embed : null;
      document.getElementById("fEmbedType").value = embed ? embed.type : "";
      document.getElementById("fEmbedUrl").value = embed ? embed.url : "";

      document.getElementById("fActions").value = ann && ann.actions ? JSON.stringify(ann.actions, null, 2) : "";
      document.getElementById("editorDialog").show();
    }

    function closeEditor() {
      editingId = null;
      document.getElementById("editorDialog").close();
    }

    function buildPayload(includePush = false) {
      const title = document.getElementById("fTitle").value.trim();
      const content = document.getElementById("fContent").value.trim();
      if (!title || !content) throw new Error("標題和內容為必填。");

      const payload = { title, content, content_type: "markdown" };

      const id = document.getElementById("fId").value.trim();
      if (id && !editingId) payload.id = id;

      const author = document.getElementById("fAuthor").value.trim();
      if (author) payload.author = author;

      const sound = document.getElementById("fSound").value.trim();
      if (sound) payload.sound_url = sound;

      const ca = document.getElementById("fCreatedAt").value.trim();
      if (ca) payload.created_at = parseInt(ca, 10);

      const ea = document.getElementById("fExpireAt").value.trim();
      if (ea) payload.expire_at = parseInt(ea, 10);

      payload.behavior = {
        red_dot: document.getElementById("fRedDot").value,
        popup: document.getElementById("fPopup").value,
      };

      const plats = document.getElementById("fPlatforms").value.trim();
      const vc = document.getElementById("fVersion").value.trim();
      if (plats || vc) {
        payload.targets = {};
        if (plats) payload.targets.platforms = plats.split(",").map(s => s.trim()).filter(Boolean);
        if (vc) payload.targets.version_constraint = vc;
      }

      const eType = document.getElementById("fEmbedType").value.trim();
      const eUrl = document.getElementById("fEmbedUrl").value.trim();
      if (eType && eUrl) payload.embed = { type: eType, url: eUrl };

      const actRaw = document.getElementById("fActions").value.trim();
      if (actRaw) {
        try { payload.actions = JSON.parse(actRaw); } catch { throw new Error("Actions JSON 格式錯誤。"); }
      }

      if (includePush) {
        payload.send_push_notification = document.getElementById("fSendPush").checked;
      }

      return payload;
    }

    async function save() {
      try {
        const payload = buildPayload(!editingId);
        const headers = { "Content-Type": "application/json", ...authHeaders() };
        if (editingId) {
          await fetch(`/api/v1/announcements/${encodeURIComponent(editingId)}`, {
            method: "PATCH", headers, body: JSON.stringify(payload),
          }).then(async r => { if (!r.ok) { const b = await r.json().catch(() => ({})); throw new Error(b.detail || `HTTP ${r.status}`); } return r.json(); });
          showNotice("success", "已更新", `公告「${payload.title}」已更新。`);
        } else {
          const created = await fetch("/api/v1/announcements", {
            method: "POST", headers, body: JSON.stringify(payload),
          }).then(async r => { if (!r.ok) { const b = await r.json().catch(() => ({})); throw new Error(b.detail || `HTTP ${r.status}`); } return r.json(); });
          const pushMessage = describePushResult(created.push_notification);
          showNotice(
            "success",
            "已建立",
            pushMessage
              ? `公告「${payload.title}」已建立。${pushMessage}`
              : `公告「${payload.title}」已建立。`,
          );
        }
        closeEditor();
        await loadAll();
      } catch (e) {
        showNotice("error", "儲存失敗", e.message);
      }
    }

    async function deleteAnn() {
      if (!editingId) return;
      if (!confirm(`確定要讓公告「${editingId}」立即過期嗎？`)) return;
      try {
        const now = Math.floor(Date.now() / 1000);
        const headers = { "Content-Type": "application/json", ...authHeaders() };
        await fetch(`/api/v1/announcements/${encodeURIComponent(editingId)}`, {
          method: "PATCH", headers, body: JSON.stringify({ expire_at: now }),
        }).then(async r => { if (!r.ok) { const b = await r.json().catch(() => ({})); throw new Error(b.detail || `HTTP ${r.status}`); } return r.json(); });
        showNotice("success", "已設為過期", `公告已立即過期。`);
        closeEditor();
        await loadAll();
      } catch (e) {
        showNotice("error", "操作失敗", e.message);
      }
    }

    document.getElementById("btnNew").addEventListener("click", () => openEditor(null));
    document.getElementById("btnRefresh").addEventListener("click", loadAll);
    document.getElementById("btnCancel").addEventListener("click", closeEditor);
    document.getElementById("btnSave").addEventListener("click", save);
    document.getElementById("btnDelete").addEventListener("click", deleteAnn);

    // Navigation setup
    document.getElementById("tabAnalytics").addEventListener("click", () => window.location.href = "/admin/analytics");
    document.getElementById("tabAnnouncements").addEventListener("click", () => window.location.href = "/admin/announcements");
    document.getElementById("tabUsers").addEventListener("click", () => window.location.href = "/admin/user_manage");
    document.getElementById("tabFeedbacks").addEventListener("click", () => window.location.href = "/admin/feedbacks");
    document.getElementById("tabAccount").addEventListener("click", () => window.location.href = "/account");

    // Boot
    if (!token()) { window.location.replace("/auth"); }
    else { loadAll(); }
  </script>
</body>
</html>
