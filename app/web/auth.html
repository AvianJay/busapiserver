<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YABus 帳號登入</title>
  
  <!-- Load Roboto Font & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

  <!-- Import Maps for @material/web -->
  <script type="importmap">
    {
      "imports": {
        "@material/web/": "https://esm.run/@material/web/"
      }
    }
  </script>

  <!-- Import Material Web Components Modules -->
  <script type="module">
    import '@material/web/all.js';
    import {styles as typescaleStyles} from '@material/web/typography/md-typescale-styles.js';
    if (document.adoptedStyleSheets) {
      document.adoptedStyleSheets = [...document.adoptedStyleSheets, typescaleStyles.styleSheet];
    }
  </script>

  <style>
    :root {
      /* M3 Dark Palette */
      --md-sys-color-primary: #80f3d6;
      --md-sys-color-on-primary: #00382d;
      --md-sys-color-primary-container: #005142;
      --md-sys-color-on-primary-container: #9dfad7;
      --md-sys-color-secondary: #b0ccc2;
      --md-sys-color-on-secondary: #1b352e;
      --md-sys-color-surface: #0f1418;
      --md-sys-color-on-surface: #e1e3e0;
      --md-sys-color-surface-container: #202327;
      --md-sys-color-surface-container-high: #2a2d32;
      --md-sys-color-outline: #8a928f;
      --md-sys-color-outline-variant: #3f4946;
      --md-sys-color-error: #ffb4ab;
      --md-sys-color-on-error: #690005;
      --md-sys-color-error-container: #93000a;
      --md-sys-color-on-error-container: #ffdad6;
    }

    * {
      box-sizing: border-box;
    }

    body, h1, h2, h3, p, ul, ol, li, form, label {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      font-family: Roboto, system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    main {
      width: 100%;
      max-width: 420px;
      animation: fadeInUp 0.5s ease-out both;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-card {
      background-color: var(--md-sys-color-surface-container);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: 28px; /* M3 extra large shape */
      padding: 40px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0px 4px 24px rgba(0, 0, 0, 0.3);
    }

    .brand-section {
      margin-bottom: 32px;
    }

    .brand-title {
      font-weight: 700;
      color: var(--md-sys-color-primary);
      margin-bottom: 8px;
    }

    .brand-subtitle {
      color: var(--md-sys-color-on-surface);
      opacity: 0.8;
    }

    .buttons-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    md-filled-button {
      width: 100%;
      height: 56px;
      --md-filled-button-container-shape: 16px;
      --md-filled-button-label-text-font: Roboto, system-ui;
      --md-filled-button-label-text-size: 15px;
      --md-filled-button-label-text-weight: 500;
    }

    .button-google {
      --md-filled-button-container-color: #e54235;
      --md-filled-button-label-text-color: #ffffff;
      --md-filled-button-hover-state-layer-color: #ffffff;
    }

    .button-discord {
      --md-filled-button-container-color: #5865f2;
      --md-filled-button-label-text-color: #ffffff;
      --md-filled-button-hover-state-layer-color: #ffffff;
    }

    #sessionNote {
      display: none; /* Managed by JS */
      width: 100%;
      gap: 8px;
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: 16px;
      padding: 16px;
      background-color: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface);
      margin-bottom: 24px;
      text-align: left;
      font-size: 13px;
      line-height: 1.6;
    }

    #sessionNote strong {
      font-size: 14px;
      color: var(--md-sys-color-primary);
      display: block;
      margin-bottom: 4px;
    }

    #sessionNote a {
      color: var(--md-sys-color-primary);
      text-decoration: none;
      font-weight: 500;
    }

    #sessionNote a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <main>
    <section class="login-card">
      <div class="brand-section">
        <h1 class="brand-title md-typescale-display-small">YABus 帳號登入</h1>
        <p class="brand-subtitle md-typescale-body-medium">請選擇登入方式以同步帳號資料</p>
      </div>

      <div id="sessionNote"></div>

      <div class="buttons-container">
        <md-filled-button class="button-google" id="googleLogin" href="#">
          <svg slot="icon" viewBox="0 0 24 24" width="18" height="18">
            <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
            <path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
            <path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
            <path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
          </svg>
          使用 Google 登入
        </md-filled-button>

        <md-filled-button class="button-discord" id="discordLogin" href="#">
          <svg slot="icon" viewBox="0 0 127.14 96.36" width="18" height="18" fill="currentColor">
            <path d="M107.7,8.07A105.15,105.15,0,0,0,77.26,0a77.19,77.19,0,0,0-3.3,6.83A96.67,96.67,0,0,0,53.22,6.83,77.19,77.19,0,0,0,49.88,0,105.15,105.15,0,0,0,19.44,8.07C3.66,31.58-1.86,54.65,1,77.53A105.73,105.73,0,0,0,32,96.36a77.7,77.7,0,0,0,6.63-10.85,68.43,68.43,0,0,1-10.5-5c.88-.65,1.72-1.34,2.51-2a75.58,75.58,0,0,0,72.9,0c.79.71,1.63,1.4,2.51,2a68.43,68.43,0,0,1-10.5,5,77.7,77.7,0,0,0,6.63,10.85,105.73,105.73,0,0,0,31-18.83C129.87,50.75,124.23,27.87,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53S36.18,40.36,42.45,40.36,53.9,46,53.9,53,48.72,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.24,60,73.24,53S78.41,40.36,84.69,40.36,96.14,46,96.14,53,91,65.69,84.69,65.69Z"/>
          </svg>
          使用 Discord 登入
        </md-filled-button>
      </div>
    </section>
  </main>

  <script>
    const STORAGE_KEYS = Object.freeze({
      authSession: "yabus_auth_session",
      deviceKey: "yabus_device_key",
    });

    function uuidv4() {
      return "10000000-1000-4000-8000-100000000000".replace(/[018]/g, (c) =>
        (Number(c) ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (Number(c) / 4)))).toString(16)
      );
    }

    function ensureDeviceKey() {
      const stored = localStorage.getItem(STORAGE_KEYS.deviceKey);
      if (stored) {
        return stored;
      }
      const generated = uuidv4();
      localStorage.setItem(STORAGE_KEYS.deviceKey, generated);
      return generated;
    }

    function readSession() {
      const raw = localStorage.getItem(STORAGE_KEYS.authSession);
      if (!raw) {
        return null;
      }
      try {
        return JSON.parse(raw);
      } catch {
        localStorage.removeItem(STORAGE_KEYS.authSession);
        return null;
      }
    }

    function buildStartUrl(provider) {
      const search = new URLSearchParams(window.location.search);
      const params = new URLSearchParams();
      params.set("platform", search.get("platform") || "web");
      const redirect = search.get("redirect") || "";
      if (redirect) {
        params.set("redirect", redirect);
      }
      params.set("device_key", ensureDeviceKey());
      return `/api/v1/auth/${provider}-start?${params.toString()}`;
    }

    function renderSessionNote() {
      const note = document.getElementById("sessionNote");
      const session = readSession();
      if (!session || !session.token) {
        note.style.display = "none";
        return;
      }
      note.style.display = "block";
      note.innerHTML = [
        `<strong>目前已登入 ${session.display_name || "這個帳號"}</strong>`,
        `<span>上次登入方式：${session.provider || "unknown"}，你也可以直接去 <a class="muted-link" href="/account">帳戶頁</a> 管理連結與裝置。</span>`,
      ].join("");
    }

    // Material 3 button click navigation fallback for components inside anchor-like behavior
    document.getElementById("googleLogin").addEventListener("click", () => {
      window.location.href = buildStartUrl("google");
    });
    document.getElementById("discordLogin").addEventListener("click", () => {
      window.location.href = buildStartUrl("discord");
    });

    renderSessionNote();
  </script>
</body>

</html>
