<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YABus Admin Users</title>
  
  <!-- Load Roboto Font & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

  <!-- Define the Import Map -->
  <script type="importmap">
    {
      "imports": {
        "@material/web/": "https://esm.run/@material/web/"
      }
    }
  </script>

  <!-- Import Material Web Components Modules -->
  <script type="module">
    import '@material/web/all.js';
    import {styles as typescaleStyles} from '@material/web/typography/md-typescale-styles.js';
    if (document.adoptedStyleSheets) {
      document.adoptedStyleSheets = [...document.adoptedStyleSheets, typescaleStyles.styleSheet];
    }
  </script>

  <style>
    :root {
      /* M3 Dark Palette */
      --md-sys-color-primary: #80f3d6;
      --md-sys-color-on-primary: #00382d;
      --md-sys-color-primary-container: #005142;
      --md-sys-color-on-primary-container: #9dfad7;
      --md-sys-color-secondary: #b0ccc2;
      --md-sys-color-on-secondary: #1b352e;
      --md-sys-color-surface: #0f1418;
      --md-sys-color-on-surface: #e1e3e0;
      --md-sys-color-surface-container: #202327;
      --md-sys-color-surface-container-high: #2a2d32;
      --md-sys-color-outline: #8a928f;
      --md-sys-color-outline-variant: #3f4946;
      --md-sys-color-error: #ffb4ab;
      --md-sys-color-on-error: #690005;
      --md-sys-color-error-container: #93000a;
      --md-sys-color-on-error-container: #ffdad6;
    }

    * {
      box-sizing: border-box;
    }

    body, h1, h2, h3, p, ul, ol, li, form, label {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      font-family: Roboto, system-ui, -apple-system, sans-serif;
      padding-bottom: 60px;
    }

    /* Tabs Styling */
    md-tabs {
      background-color: var(--md-sys-color-surface-container);
      --md-tabs-active-tab-indicator-color: var(--md-sys-color-primary);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    md-primary-tab {
      --md-primary-tab-active-label-text-color: var(--md-sys-color-primary);
      --md-primary-tab-active-icon-color: var(--md-sys-color-primary);
      --md-primary-tab-label-text-color: var(--md-sys-color-outline);
      --md-primary-tab-icon-color: var(--md-sys-color-outline);
      font-family: Roboto, system-ui;
    }

    /* Layout Containers */
    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .header-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .search-bar-container {
      width: 100%;
      max-width: 400px;
    }

    md-outlined-text-field {
      width: 100%;
      --md-outlined-text-field-container-shape: 12px;
    }

    /* M3 Card Styles */
    .m3-card {
      background-color: var(--md-sys-color-surface-container);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .m3-card-title {
      font-weight: 700;
      color: var(--md-sys-color-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Summary Metrics */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
    }

    .summary-item {
      background-color: var(--md-sys-color-surface-container-high);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .summary-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--md-sys-color-outline);
    }

    .summary-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--md-sys-color-on-surface);
    }

    /* User list cards */
    .user-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .user-card {
      background-color: var(--md-sys-color-surface-container-high);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .user-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .pill-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .user-actions {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }

    .stats-card {
      background-color: var(--md-sys-color-surface-container);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: 12px;
      padding: 12px;
    }

    .stats-label {
      font-size: 11px;
      color: var(--md-sys-color-outline);
      margin-bottom: 2px;
    }

    .stats-value {
      font-size: 14px;
      font-weight: 500;
    }

    /* Identities */
    .identity-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }

    .identity-item {
      background-color: var(--md-sys-color-surface-container);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 13px;
    }

    .identity-title {
      font-weight: 700;
      word-break: break-all;
    }

    .identity-subtitle {
      color: var(--md-sys-color-outline);
      font-size: 11px;
    }

    .notice {
      border-radius: 12px;
      padding: 16px;
      border: 1px solid var(--md-sys-color-outline-variant);
      font-size: 14px;
      line-height: 1.6;
    }

    .notice.success {
      background-color: rgba(52, 211, 153, 0.1);
      border-color: rgba(52, 211, 153, 0.4);
      color: #34d399;
    }

    .notice.error {
      background-color: rgba(248, 113, 113, 0.1);
      border-color: rgba(248, 113, 113, 0.4);
      color: #f87171;
    }

    .empty {
      color: var(--md-sys-color-outline);
      font-size: 13px;
      text-align: center;
      padding: 32px;
      border: 1px dashed var(--md-sys-color-outline-variant);
      border-radius: 12px;
    }

    .mono {
      font-family: monospace;
    }
  </style>
</head>
<body>

  <md-tabs id="adminTabs" active-tab-index="2">
    <md-primary-tab id="tabAnalytics">
      <md-icon slot="icon">analytics</md-icon>
      數據統計
    </md-primary-tab>
    <md-primary-tab id="tabAnnouncements">
      <md-icon slot="icon">campaign</md-icon>
      公告管理
    </md-primary-tab>
    <md-primary-tab id="tabUsers">
      <md-icon slot="icon">manage_accounts</md-icon>
      用戶管理
    </md-primary-tab>
    <md-primary-tab id="tabFeedbacks">
      <md-icon slot="icon">inbox</md-icon>
      意見回饋
    </md-primary-tab>
    <md-primary-tab id="tabAccount">
      <md-icon slot="icon">account_circle</md-icon>
      帳戶中心
    </md-primary-tab>
  </md-tabs>

  <main>
    <section class="header-panel">
      <div>
        <h1 class="md-typescale-headline-medium" style="font-weight: 700;">用戶管理</h1>
        <p class="md-typescale-body-medium" style="color: var(--md-sys-color-outline); margin-top: 4px;">
          查看帳號、綁定身份、角色與活躍裝置，必要時直接調整權限或強制登出全部裝置。
        </p>
      </div>
      <div>
        <md-filled-button id="refreshButton" type="button">
          <md-icon slot="icon">refresh</md-icon>
          重新整理
        </md-filled-button>
      </div>
    </section>

    <div id="noticeArea"></div>

    <section class="m3-card">
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
        <h2 class="m3-card-title md-typescale-title-medium">
          <md-icon>group</md-icon>
          用戶摘要
        </h2>
        <div class="search-bar-container">
          <md-outlined-text-field id="searchInput" type="search" label="快速篩選">
            <md-icon slot="leading-icon">search</md-icon>
          </md-outlined-text-field>
        </div>
      </div>
      <div class="summary-grid" id="summaryGrid"></div>
    </section>

    <section class="m3-card">
      <h2 class="m3-card-title md-typescale-title-medium">
        <md-icon>list</md-icon>
        用戶列表
      </h2>
      <div class="user-list" id="userList"></div>
    </section>
  </main>

  <script>
    const AUTH_TOKEN_COOKIE = "yabus_auth_token";
    const SESSION_KEY = "yabus_auth_session";

    const state = {
      accounts: [],
      summary: null,
      busyAccountId: "",
      filter: "",
    };

    function readSession() {
      const raw = localStorage.getItem(SESSION_KEY);
      if (!raw) {
        return null;
      }
      try {
        return JSON.parse(raw);
      } catch {
        return null;
      }
    }

    function readCookieToken() {
      const prefix = `${AUTH_TOKEN_COOKIE}=`;
      const match = document.cookie.split("; ").find((entry) => entry.startsWith(prefix));
      return match ? decodeURIComponent(match.slice(prefix.length)) : "";
    }

    function token() {
      const session = readSession();
      return (session && session.token) || readCookieToken() || "";
    }

    function authHeaders(extra = {}) {
      const authToken = token();
      return authToken
        ? { Authorization: `Bearer ${authToken}`, ...extra }
        : { ...extra };
    }

    function escapeHtml(value) {
      const div = document.createElement("div");
      div.textContent = value == null ? "" : String(value);
      return div.innerHTML;
    }

    function formatTime(value) {
      if (!value) {
        return "未記錄";
      }
      return new Date(Number(value) * 1000).toLocaleString("zh-TW", {
        timeZone: "Asia/Taipei",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
      });
    }

    async function apiFetch(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        headers: authHeaders(options.headers || {}),
      });
      const isJson = (response.headers.get("content-type") || "").includes("application/json");
      const payload = isJson ? await response.json() : null;
      if (!response.ok) {
        if (response.status === 401) {
          window.location.replace("/auth");
          return null;
        }
        const message = payload && payload.detail ? payload.detail : `HTTP ${response.status}`;
        throw new Error(message);
      }
      return payload;
    }

    function setNotice(kind, title, message) {
      const root = document.getElementById("noticeArea");
      root.innerHTML = `
        <div class="notice ${kind}">
          <strong style="display: block; margin-bottom: 4px;">${escapeHtml(title)}</strong>
          <p>${escapeHtml(message)}</p>
        </div>
      `;
    }

    function clearNotice() {
      document.getElementById("noticeArea").innerHTML = "";
    }

    function matchesFilter(account) {
      if (!state.filter) {
        return true;
      }
      const haystack = [
        account.account_id,
        account.role,
        ...(account.identities || []).flatMap((identity) => [
          identity.provider,
          identity.email,
          identity.display_name,
          identity.provider_user_id,
        ]),
      ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();
      return haystack.includes(state.filter);
    }

    function renderSummary() {
      const root = document.getElementById("summaryGrid");
      const summary = state.summary || {};
      const cards = [
        ["總帳號", summary.total_accounts || 0],
        ["Admin", summary.admin_count || 0],
        ["Mod", summary.mod_count || 0],
        ["User", summary.user_count || 0],
        ["活躍裝置", summary.active_device_count || 0],
      ];
      root.innerHTML = cards.map(([label, value]) => `
        <article class="summary-item">
          <span class="summary-label">${escapeHtml(label)}</span>
          <span class="summary-value">${escapeHtml(value)}</span>
        </article>
      `).join("");
    }

    function renderIdentities(identities) {
      if (!identities || !identities.length) {
        return '<div class="empty">這個帳號目前沒有任何 OAuth 身份。</div>';
      }
      return `
        <div class="identity-list">
          ${identities.map((identity) => `
            <div class="identity-item">
              <span class="identity-title">${escapeHtml(identity.display_name || identity.email || identity.provider_user_id || identity.provider)}</span>
              <span class="identity-subtitle">${escapeHtml(identity.provider)}</span>
              ${identity.email ? `<span class="identity-subtitle">${escapeHtml(identity.email)}</span>` : ""}
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderUsers() {
      const root = document.getElementById("userList");
      const accounts = state.accounts.filter(matchesFilter);
      if (!accounts.length) {
        root.innerHTML = '<div class="empty">沒有符合條件的帳號。</div>';
        return;
      }

      root.innerHTML = accounts.map((account) => {
        const busy = state.busyAccountId === account.account_id;
        const role = account.role || "user";
        return `
          <article class="user-card">
            <div class="user-head">
              <div>
                <div class="pill-row" style="margin-bottom: 6px;">
                  <md-filter-chip label="${escapeHtml(role)}" selected style="--md-filter-chip-selected-container-color: var(--md-sys-color-primary-container); --md-filter-chip-selected-label-text-color: var(--md-sys-color-on-primary-container);"></md-filter-chip>
                  <span class="mono" style="font-weight: 700;">ID: ${escapeHtml(account.account_id)}</span>
                </div>
              </div>
              <div class="user-actions">
                <md-outlined-select style="min-width: 120px;" data-role-select="${escapeHtml(account.account_id)}" ${busy ? "disabled" : ""}>
                  <md-select-option value="admin" ${account.role === "admin" ? "selected" : ""}>admin</md-select-option>
                  <md-select-option value="mod" ${account.role === "mod" ? "selected" : ""}>mod</md-select-option>
                  <md-select-option value="user" ${account.role === "user" ? "selected" : ""}>user</md-select-option>
                </md-outlined-select>
                <md-filled-button type="button" data-role-save="${escapeHtml(account.account_id)}" ${busy ? "disabled" : ""}>更新角色</md-filled-button>
                <md-outlined-button type="button" data-logout-all="${escapeHtml(account.account_id)}" ${busy ? "disabled" : ""} style="--md-outlined-button-outline-color: var(--md-sys-color-error); --md-outlined-button-label-text-color: var(--md-sys-color-error);">
                  登出全部裝置
                </md-outlined-button>
              </div>
            </div>

            <div class="stats-grid">
              <div class="stats-card">
                <div class="stats-label">建立時間</div>
                <div class="stats-value">${escapeHtml(formatTime(account.created_at))}</div>
              </div>
              <div class="stats-card">
                <div class="stats-label">更新時間</div>
                <div class="stats-value">${escapeHtml(formatTime(account.updated_at))}</div>
              </div>
              <div class="stats-card">
                <div class="stats-label">最後活動</div>
                <div class="stats-value">${escapeHtml(formatTime(account.last_seen_at))}</div>
              </div>
              <div class="stats-card">
                <div class="stats-label">裝置數 (活躍/總數)</div>
                <div class="stats-value">${escapeHtml(`${account.active_device_count || 0} / ${account.device_count || 0}`)}</div>
              </div>
            </div>

            ${renderIdentities(account.identities || [])}
          </article>
        `;
      }).join("");

      root.querySelectorAll("[data-role-save]").forEach((button) => {
        button.addEventListener("click", () => handleRoleSave(button.getAttribute("data-role-save") || ""));
      });
      root.querySelectorAll("[data-logout-all]").forEach((button) => {
        button.addEventListener("click", () => handleLogoutAll(button.getAttribute("data-logout-all") || ""));
      });
    }

    function render() {
      renderSummary();
      renderUsers();
      document.getElementById("refreshButton").disabled = Boolean(state.busyAccountId);
    }

    async function loadUsers() {
      state.busyAccountId = "__loading__";
      render();
      try {
        const payload = await apiFetch("/api/v1/admin/users");
        if (!payload) {
          return;
        }
        state.accounts = payload.accounts || [];
        state.summary = payload.summary || null;
        clearNotice();
      } catch (error) {
        setNotice("error", "載入失敗", error.message || String(error));
      } finally {
        state.busyAccountId = "";
        render();
      }
    }

    async function handleRoleSave(accountId) {
      if (!accountId) {
        return;
      }
      const select = document.querySelector(`[data-role-select="${CSS.escape(accountId)}"]`);
      if (!select) {
        return;
      }
      state.busyAccountId = accountId;
      render();
      try {
        const payload = await apiFetch(`/api/v1/admin/users/${encodeURIComponent(accountId)}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ role: select.value }),
        });
        setNotice("success", "角色已更新", `帳號 ${payload.account_id} 已改成 ${payload.role}。`);
        await loadUsers();
      } catch (error) {
        setNotice("error", "更新角色失敗", error.message || String(error));
      } finally {
        state.busyAccountId = "";
        render();
      }
    }

    async function handleLogoutAll(accountId) {
      if (!accountId) {
        return;
      }
      if (!window.confirm(`確定要強制登出帳號 ${accountId} 的所有裝置嗎？`)) {
        return;
      }
      state.busyAccountId = accountId;
      render();
      try {
        const payload = await apiFetch(`/api/v1/admin/users/${encodeURIComponent(accountId)}/logout-all`, {
          method: "POST",
        });
        setNotice("success", "已強制登出", `帳號 ${payload.account_id} 已撤銷 ${payload.revoked_sessions} 個工作階段。`);
        await loadUsers();
      } catch (error) {
        setNotice("error", "登出失敗", error.message || String(error));
      } finally {
        state.busyAccountId = "";
        render();
      }
    }

    document.getElementById("refreshButton").addEventListener("click", loadUsers);
    document.getElementById("searchInput").addEventListener("input", (event) => {
      state.filter = (event.target.value || "").trim().toLowerCase();
      renderUsers();
    });

    // Navigation setup
    document.getElementById("tabAnalytics").addEventListener("click", () => window.location.href = "/admin/analytics");
    document.getElementById("tabAnnouncements").addEventListener("click", () => window.location.href = "/admin/announcements");
    document.getElementById("tabUsers").addEventListener("click", () => window.location.href = "/admin/user_manage");
    document.getElementById("tabFeedbacks").addEventListener("click", () => window.location.href = "/admin/feedbacks");
    document.getElementById("tabAccount").addEventListener("click", () => window.location.href = "/account");

    if (!token()) {
      window.location.replace("/auth");
    } else {
      loadUsers();
    }
  </script>
</body>
</html>
